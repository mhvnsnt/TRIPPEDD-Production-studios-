<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#09090b"/>
  <text x="50" y="65" fill="#fff" font-family="sans-serif" font-size="42" font-weight="700">TRIPPEDD — EP01 / THE LOST ACID</text>
  <text x="50" y="105" fill="#facc15" font-family="sans-serif" font-size="22">REALITY / SUBJECTIVITY REFERENCE BOARD</text>
  <g font-family="sans-serif" font-size="20" fill="#fff">
    <rect x="50" y="145" width="400" height="220" fill="#17171a" stroke="#444"/>
    <text x="70" y="180">1 — LIVE ACTION</text>
    <text x="70" y="220">Character remembers the acid.</text>
    <text x="70" y="255">Hope: the day can still be salvaged.</text>
    <text x="70" y="310" fill="#a1a1aa">Grounded motel / handheld / improv.</text>
    <rect x="500" y="145" width="400" height="220" fill="#24113a" stroke="#7c3aed"/>
    <text x="520" y="180">2 — SUBJECTIVE SHIFT</text>
    <text x="520" y="220">Reality starts breaking.</text>
    <text x="520" y="255">Animation / AI / VFX / 3D / Blender.</text>
    <text x="520" y="310" fill="#c4b5fd">The audience sees the trip.</text>
    <rect x="950" y="145" width="400" height="220" fill="#102a35" stroke="#22d3ee"/>
    <text x="970" y="180">3 — IMPOSSIBLE WORLD</text>
    <text x="970" y="220">The visual language goes insane.</text>
    <text x="970" y="255">Do not explain the spectacle.</text>
    <text x="970" y="310" fill="#67e8f9">Character's baseline is different.</text>
    <rect x="50" y="410" width="400" height="220" fill="#17171a" stroke="#444"/>
    <text x="70" y="445">4 — REALITY RETURN</text>
    <text x="70" y="490">Back to ordinary live action.</text>
    <text x="70" y="535">“That shit wasn't even working.”</text>
    <rect x="500" y="410" width="400" height="220" fill="#17171a" stroke="#444"/>
    <text x="520" y="445">5 — SEARCH</text>
    <text x="520" y="490">He cannot find the acid.</text>
    <text x="520" y="535">Frantic → stupidly methodical → defeated.</text>
    <rect x="950" y="410" width="400" height="220" fill="#17171a" stroke="#facc15"/>
    <text x="970" y="445" fill="#facc15">6 — TERMINAL BUTTON</text>
    <text x="970" y="490">The acid is simply gone.</text>
    <text x="970" y="535">He never got to trip.</text>
    <text x="970" y="580">CUT TO BLACK.</text>
  </g>
  <text x="50" y="715" fill="#fff" font-family="sans-serif" font-size="25" font-weight="700">SHOW RULE</text>
  <text x="50" y="755" fill="#d4d4d8" font-family="sans-serif" font-size="23">The AI may make the world insane. The character gets to say it wasn't shit.</text>
  <text x="50" y="805" fill="#71717a" font-family="sans-serif" font-size="18">Development reference — not final art. Preserve physical-source provenance for every real or generated component.</text>
</svg>
