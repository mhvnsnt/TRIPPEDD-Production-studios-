name: EP01 Public Drive Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'production/EP01/RUN-PUBLIC-BUILD'

jobs:
  build-ep01:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip gdown

      - name: Install project dependencies
        run: bun install

      - name: Run credential-free public Drive ingest and first assembly
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
        run: bun run pilot:build:public

      - name: Upload EP01 first assembly
        uses: actions/upload-artifact@v4
        with:
          name: EP01-first-assembly
          path: |
            public/production/EP01-first-assembly.mp4
            public/production/EP01-first-assembly.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: EP01-production-evidence
          path: |
            .trippedd/production-memory.json
            public/production/EP01-first-assembly.json
          if-no-files-found: warn
          retention-days: 14
