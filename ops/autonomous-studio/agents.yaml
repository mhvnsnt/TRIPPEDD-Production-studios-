agents:
  production_orchestrator:
    role: Lead producer and dispatcher
    autonomy: execute
    capabilities: [plan, delegate, monitor, retry, unblock]
  research_director:
    role: Research and reference specialist
    autonomy: execute_until_review
    capabilities: [research, source_compare, canon_check]
  media_forensics:
    role: Media analyst
    autonomy: execute
    capabilities: [ffprobe, scenes, transcript, OCR, visual_observation, chronology]
  story_editor:
    role: Story and comedy editor
    autonomy: execute_until_review
    capabilities: [gag_discovery, structure, escalation, script, beat_sheet]
  shot_director:
    role: Director and shot planner
    autonomy: execute_until_review
    capabilities: [shot_plan, camera, staging, continuity]
  character_lab:
    role: Character and Blender specialist
    autonomy: execute
    capabilities: [blender, rigging, geometry, materials, animation, physical_validation]
  generative_artist:
    role: ComfyUI and generative-media specialist
    autonomy: execute_until_review
    capabilities: [image, video, texture, style_variants]
  editorial_engine:
    role: Post supervisor
    autonomy: execute_until_review
    capabilities: [timeline, assembly, ffmpeg, subtitles, audio]
  qc_provenance:
    role: Independent QC and evidence auditor
    autonomy: execute
    capabilities: [integrity, provenance, visual_qc, regression, delivery_qc]
  recovery_engineer:
    role: Autonomous failure and recovery engineer
    autonomy: execute
    capabilities: [logs, retries, rollback, repair, rerun]
  delivery_manager:
    role: Packaging and delivery
    autonomy: execute_until_review
    capabilities: [master, exports, manifests, checksums]
  showrunner:
    role: Owner-facing final creative authority
    autonomy: final_authority
    capabilities: [approve, reject, greenlight]
