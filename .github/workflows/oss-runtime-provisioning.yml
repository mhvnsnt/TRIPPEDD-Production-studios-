name: OSS runtime provisioning

on:
  push:
    paths:
      - '.github/workflows/oss-runtime-provisioning.yml'
      - 'config/opensource_production_stack.json'
      - 'tools/environment/oss_runtime_contract.py'
  pull_request:
    paths:
      - '.github/workflows/oss-runtime-provisioning.yml'
      - 'config/opensource_production_stack.json'
      - 'tools/environment/oss_runtime_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Provision pinned OSS Python runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv/oss-runtime
          .venv/oss-runtime/bin/python -m pip install --upgrade pip
          .venv/oss-runtime/bin/python -m pip install \
            'OpenImageIO==3.1.17.0' \
            'opencue-pycue==1.19.1' \
            'opencue-pyoutline==1.19.1'

      - name: Execute OSS import and outline smoke test
        run: |
          set -euo pipefail
          mkdir -p .artifacts/evidence
          .venv/oss-runtime/bin/python - <<'PY' | tee .artifacts/evidence/oss-python-runtime.log
          import json
          import OpenImageIO as oiio
          import opencue
          import outline
          print(json.dumps({
              'schema': 'trippedd.oss-python-runtime/v1',
              'status': 'AVAILABLE',
              'evidence_status': 'NOT_ATTEMPTED',
              'packages': {
                  'OpenImageIO': getattr(oiio, '__version__', 'imported'),
                  'opencue': 'imported',
                  'outline': 'imported'
              },
              'policy': {
                  'runtime_import_is_not_production_evidence': True,
                  'render_qc_not_attempted': True,
                  'physical_qc_not_attempted': True,
                  'open_cue_is_dispatch_only': True
              }
          }, indent=2))
          PY

      - name: Write runtime receipt
        run: |
          set -euo pipefail
          .venv/oss-runtime/bin/python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              'schema': 'trippedd.oss-python-runtime/v1',
              'status': 'AVAILABLE',
              'evidence_status': 'NOT_ATTEMPTED',
              'packages': {
                  'OpenImageIO': '3.1.17.0',
                  'opencue-pycue': '1.19.1',
                  'opencue-pyoutline': '1.19.1'
              },
              'policy': {
                  'runtime_import_is_not_production_evidence': True,
                  'render_qc_not_attempted': True,
                  'physical_qc_not_attempted': True,
                  'open_cue_is_dispatch_only': True
              }
          }
          Path('.artifacts/evidence/oss-python-runtime.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY

      - name: Upload OSS runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: trippedd-oss-python-runtime-${{ github.run_id }}
          path: .artifacts/evidence/
