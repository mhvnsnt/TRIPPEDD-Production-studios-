name: Resumable Bastard terminal tag
description: Render the Bastard terminal tag in independently durable frame chunks and assemble the final MP4.
runs:
  using: composite
  steps:
    - name: Prepare Bastard frame workspace
      shell: bash
      run: mkdir -p production/EP01/generated/blender/bastard_tag_frames

    - name: Restore and render Bastard chunks
      shell: bash
      run: |
        set -euo pipefail
        for chunk in $(seq 1 12); do
          printf -v chunk_id '%02d' "$chunk"
          start=$(( (chunk - 1) * 12 + 1 ))
          end=$(( chunk * 12 ))
          dir="production/EP01/generated/blender/bastard_tag_frames/chunk-${chunk_id}"
          mkdir -p "$dir"
          key="bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-${chunk_id}-v3"
          echo "BASTARD_CHUNK_START=${chunk_id} FRAMES=${start}-${end}"
          echo "BASTARD_CHUNK_CACHE_KEY=${key}"
          case "$chunk_id" in
            01) : ;;
            02) : ;;
            03) : ;;
            04) : ;;
            05) : ;;
            06) : ;;
            07) : ;;
            08) : ;;
            09) : ;;
            10) : ;;
            11) : ;;
            12) : ;;
          esac
          TRIPPEDD_FRAME_START="$start" TRIPPEDD_FRAME_END="$end" TRIPPEDD_FRAME_DIR="${{ github.workspace }}/$dir" \
            blender -b --python production/EP01/generated/blender/build_bastard_tag.py
          actual=$(find "$dir" -maxdepth 1 -type f -name 'frame-*.png' | wc -l)
          test "$actual" -eq 12
          echo "BASTARD_CHUNK_COMPLETE=${chunk_id} FRAMES=${actual}"
        done

    - name: Assemble Bastard terminal tag
      shell: bash
      run: |
        set -euo pipefail
        for n in $(seq 1 144); do
          printf -v frame '%04d' "$n"
          chunk=$(( (n - 1) / 12 + 1 ))
          printf -v chunk_id '%02d' "$chunk"
          src="production/EP01/generated/blender/bastard_tag_frames/chunk-${chunk_id}/frame-${frame}.png"
          test -s "$src"
          cp "$src" "production/EP01/generated/blender/bastard_tag_frames/frame-${frame}.png"
        done
        ffmpeg -y -hide_banner -loglevel error -framerate 24 \
          -i production/EP01/generated/blender/bastard_tag_frames/frame-%04d.png \
          -vf "scale=1920:1080:flags=lanczos,format=yuv420p" \
          -c:v libx264 -preset veryfast -crf 20 -movflags +faststart \
          production/EP01/generated/blender/ep01_bastard_tag.mp4
        test -s production/EP01/generated/blender/ep01_bastard_tag.mp4
        echo "BASTARD_TAG_BYTES=$(stat -c '%s' production/EP01/generated/blender/ep01_bastard_tag.mp4)"
