name: Production Self-Healer

on:
  workflow_run:
    workflows:
      - EP01 Showrunner Cut
      - EP01 Autonomous Cut
    types: [completed]
    branches:
      - upgrade/production-pipeline-resilient-2026-09-08
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: production-self-healer
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest EP01 production runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: upgrade/production-pipeline-resilient-2026-09-08
        run: |
          set -euo pipefail
          runs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/runs?branch=${BRANCH}&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "EP01 Showrunner Cut" or .name == "EP01 Autonomous Cut") | [.id,.name,.status,.conclusion,.run_attempt,.head_sha,.run_started_at] | @tsv' \
            | head -n 20)"
          printf '%s\n' "$runs"
          printf '%s\n' "$runs" > /tmp/ep01-runs.tsv

      - name: Recover one completed failed production attempt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r run_id name status conclusion attempt sha started; do
            [ -n "${run_id:-}" ] || continue
            if [ "$status" = "completed" ] && [ "$conclusion" = "failure" ] && [ "${attempt:-0}" -lt 2 ]; then
              echo "Recovering failed $name run $run_id attempt $attempt at $sha"
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"
              break
            fi
          done < /tmp/ep01-runs.tsv

      - name: Recover one genuinely stuck production job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          while IFS=$'\t' read -r run_id name status conclusion attempt sha started; do
            [ -n "${run_id:-}" ] || continue
            [ "$status" = "in_progress" ] || continue
            [ "${attempt:-0}" -lt 2 ] || continue

            jobs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
            active="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.status == "in_progress") | {name,started_at,number}] | first // empty')"
            [ -n "$active" ] || continue

            active_name="$(printf '%s' "$active" | jq -r '.name')"
            active_started="$(printf '%s' "$active" | jq -r '.started_at')"
            [ "$active_started" != "null" ] || continue
            active_epoch="$(date -u -d "$active_started" +%s)"
            age=$((now-active_epoch))

            # A render/assembly job is allowed to be expensive. Only recover after
            # 110 minutes with no terminal transition, leaving the workflow's own
            # 120/180 minute hard timeouts as the final safety net.
            if [ "$age" -ge 6600 ]; then
              echo "Stuck production job detected: $name run $run_id active=$active_name age=${age}s attempt=$attempt"
              echo "Cancelling before replay so the old runner cannot race the recovery."
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/cancel"
              for i in $(seq 1 12); do
                sleep 5
                state="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/runs/${run_id}" --jq '.status')"
                [ "$state" = "completed" ] && break
              done
              final_state="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/runs/${run_id}" --jq '.status')"
              if [ "$final_state" = "completed" ]; then
                echo "Replaying the production job from cached/checkpointed artifacts."
                gh api --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  "/repos/${REPO}/actions/runs/${run_id}/rerun"
              else
                echo "Recovery deferred: old run did not reach completed state."
              fi
              break
            fi
          done < /tmp/ep01-runs.tsv

      - name: Record terminal failure after bounded retry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r run_id name status conclusion attempt sha started; do
            [ -n "${run_id:-}" ] || continue
            if [ "$status" = "completed" ] && [ "$conclusion" = "failure" ] && [ "${attempt:-0}" -ge 2 ]; then
              title="EP01 autonomous production blocked: ${name} run ${run_id}"
              if ! gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
                continue
              fi
              gh issue create --repo "$REPO" \
                --title "$title" \
                --body "<!-- EP01-AUTONOMY-BLOCKER -->\nThe production workflow failed twice without an automatic recovery.\n\n- Workflow: $name\n- Run: $run_id\n- Head: $sha\n- Final attempt: $attempt\n\nThe bounded self-healer intentionally stopped retrying. Diagnose the exact failed step, fix the root cause, and rerun the production path." \
                --label automated || true
              break
            fi
          done < /tmp/ep01-runs.tsv
