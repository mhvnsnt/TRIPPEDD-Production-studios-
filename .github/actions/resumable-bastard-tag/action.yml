name: Resumable Bastard terminal tag
description: Render the Bastard terminal tag in independently durable frame chunks and assemble the final MP4.
runs:
  using: composite
  steps:
    - name: Prepare Bastard frame workspace
      shell: bash
      run: mkdir -p production/EP01/generated/blender/bastard_tag_frames

    - name: Restore Bastard frames chunk 01
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-01/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-01-v4
    - name: Render Bastard frames chunk 01
      shell: bash
      env:
        TRIPPEDD_FRAME_START: '1'
        TRIPPEDD_FRAME_END: '12'
        TRIPPEDD_FRAME_DIR: ${{ github.workspace }}/production/EP01/generated/blender/bastard_tag_frames/chunk-01
      run: |
        set -euo pipefail
        mkdir -p "$TRIPPEDD_FRAME_DIR"
        blender -b --python production/EP01/generated/blender/build_bastard_tag.py
        test "$(find "$TRIPPEDD_FRAME_DIR" -maxdepth 1 -type f -name 'frame-*.png' | wc -l)" -eq 12
    - name: Save Bastard frames chunk 01
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-01/
