name: EP01 Story Runner Cut

on:
  workflow_dispatch:

# Story Runner is a manual comparison lane. Canonical push-triggered production
# is handled by the Showrunner and Autonomous workflows; keeping this lane manual
# prevents duplicate expensive renders on every production change.

concurrency:
  group: ep01-story-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
  BLENDER_USER_CONFIG: ${{ github.workspace }}/.trippedd/blender-config
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_GL_VERSION_OVERRIDE: '3.3'

jobs:
  render-subjectivity:
    name: Render subjectivity chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { chunk: '01', start: 1, end: 12 }
          - { chunk: '02', start: 13, end: 24 }
          - { chunk: '03', start: 25, end: 36 }
          - { chunk: '04', start: 37, end: 48 }
          - { chunk: '05', start: 49, end: 60 }
          - { chunk: '06', start: 61, end: 72 }
          - { chunk: '07', start: 73, end: 84 }
          - { chunk: '08', start: 85, end: 96 }
          - { chunk: '09', start: 97, end: 108 }
          - { chunk: '10', start: 109, end: 120 }
          - { chunk: '11', start: 121, end: 132 }
          - { chunk: '12', start: 133, end: 144 }
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/trippedd/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-${{ runner.os }}
      - name: Cache completed subjectivity frames
        uses: actions/cache@v4
        with:
          path: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}/
          key: subjectivity-${{ hashFiles('production/EP01/generated/blender/build_subjectivity.py') }}-${{ matrix.chunk }}
      - name: Install render tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl xz-utils libegl1 libgl1 libglx0 libgl1-mesa-dri libxrender1 libxi6 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libwayland-client0 mesa-utils
      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd "$BLENDER_USER_CONFIG"
          curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#$HOME/.cache/trippedd/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Preflight Blender headless renderer
        run: |
          set -euo pipefail
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
          test -e /usr/lib/x86_64-linux-gnu/libGL.so.1
          blender -b --factory-startup --python-expr "print('TRIPPEDD_BLENDER_PREFLIGHT_OK')" 2>&1 | tee /tmp/blender-preflight.log
          grep -q 'TRIPPEDD_BLENDER_PREFLIGHT_OK' /tmp/blender-preflight.log
      - name: Render resumable chunk
        env:
          TRIPPEDD_FRAME_START: ${{ matrix.start }}
          TRIPPEDD_FRAME_END: ${{ matrix.end }}
          TRIPPEDD_FRAME_DIR: ${{ github.workspace }}/production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}
        run: |
          set -euo pipefail
          mkdir -p "$TRIPPEDD_FRAME_DIR"
          expected=$((TRIPPEDD_FRAME_END - TRIPPEDD_FRAME_START + 1))
          existing=$(find "$TRIPPEDD_FRAME_DIR" -maxdepth 1 -type f -name 'frame-*.jpg' 2>/dev/null | wc -l || true)
          echo "Chunk ${{ matrix.chunk }}: ${existing}/${expected} checkpoint frames already present"
          set +e
          time blender -b --python production/EP01/generated/blender/build_subjectivity.py
          rc=$?
          set -e
          echo "Blender subjectivity exit code: $rc"
          test "$rc" -eq 0
          actual=$(find "$TRIPPEDD_FRAME_DIR" -maxdepth 1 -type f -name 'frame-*.jpg' | wc -l)
          test "$actual" -eq "$expected"
          printf -v start_padded '%04d' "$TRIPPEDD_FRAME_START"
          printf -v end_padded '%04d' "$TRIPPEDD_FRAME_END"
          checkpoint="$TRIPPEDD_FRAME_DIR/subjectivity-${start_padded}-${end_padded}.blend"
          test -s "$checkpoint"
      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-SUBJECTIVITY-CHUNK-${{ matrix.chunk }}
          path: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}/
          if-no-files-found: error
          retention-days: 30

  build-ep01-story-runner:
    needs: render-subjectivity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache assembly segments
        uses: actions/cache@v4
        with:
          path: .trippedd/media/assembly-segments
          key: story-assembly-${{ hashFiles('src/server/pilotRenderer.ts') }}-${{ runner.os }}
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .trippedd/huggingface
          key: trippedd-whisper-tiny-${{ runner.os }}
      - name: Install media stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick mediainfo tesseract-ocr curl xz-utils libegl1 libgl1 libglx0 libgl1-mesa-dri libxrender1 libxi6 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libwayland-client0 mesa-utils
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.1.0' 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'faster-whisper>=1.2.0' 'opentimelineio>=0.18.1'
      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_USER_CONFIG"
          curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o /tmp/${BLENDER_ARCHIVE}
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#/tmp/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "/tmp/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Preflight Blender headless renderer
        run: |
          set -euo pipefail
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
          test -e /usr/lib/x86_64-linux-gnu/libGL.so.1
          blender -b --factory-startup --python-expr "print('TRIPPEDD_BLENDER_PREFLIGHT_OK')" 2>&1 | tee /tmp/blender-preflight.log
          grep -q 'TRIPPEDD_BLENDER_PREFLIGHT_OK' /tmp/blender-preflight.log
      - name: Download subjectivity chunks
        uses: actions/download-artifact@v4
        with:
          pattern: EP01-STORY-SUBJECTIVITY-CHUNK-*
          path: production/EP01/generated/blender/subjectivity
          merge-multiple: false
      - name: Verify and assemble subjectivity
        run: |
          set -euo pipefail
          mkdir -p production/EP01/generated/blender/subjectivity/assembled
          for n in $(seq 1 144); do
            printf -v frame '%04d' "$n"
            chunk=$(( (n - 1) / 12 + 1 )); printf -v chunk '%02d' "$chunk"
            src="production/EP01/generated/blender/subjectivity/EP01-STORY-SUBJECTIVITY-CHUNK-${chunk}/frame-${frame}.jpg"
            test -s "$src"
            cp "$src" "production/EP01/generated/blender/subjectivity/assembled/frame-${frame}.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error -framerate 24 -i production/EP01/generated/blender/subjectivity/assembled/frame-%04d.jpg -vf "scale=1920:1080:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -movflags +faststart production/EP01/generated/blender/ep01_subjectivity.mp4
          test -s production/EP01/generated/blender/ep01_subjectivity.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate -of json production/EP01/generated/blender/ep01_subjectivity.mp4 > production/EP01/generated/blender/subjectivity-qc.json
      - name: Build 2D comic Bastard terminal tag
        run: |
          set -euo pipefail
          bun run scripts/build-bastard-tag-2d.ts
          test -s production/EP01/generated/comic/bannon-the-bastard-terminal.svg
          test -s production/EP01/generated/comic/ep01_bastard_tag.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate -of json production/EP01/generated/comic/ep01_bastard_tag.mp4 > production/EP01/generated/comic/ep01_bastard_tag.ffprobe.json
          mkdir -p production/EP01/generated/blender
          cp production/EP01/generated/comic/ep01_bastard_tag.mp4 production/EP01/generated/blender/ep01_bastard_tag.mp4
      - name: Install Node dependencies
        run: bun install
      - name: Build Story Runner cut
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_SEGMENT_CACHE: ${{ github.workspace }}/.trippedd/media/assembly-segments
          HF_HOME: ${{ github.workspace }}/.trippedd/huggingface
          TRIPPEDD_ENABLE_WHISPER: 'false'
          WHISPER_MODEL: 'tiny'
          TRIPPEDD_WHISPER_DEVICE: 'cpu'
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_CUT_MODE: SHOWRUNNER
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
          MEDIA_MAX_CONCURRENT: '1'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
          EP01_RENDER_CONCURRENCY: '4'
        run: bun run pilot:build:public
      - name: Verify Story Runner
        env:
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
        run: |
          set -euo pipefail
          test -s public/production/EP01-STORY-RUNNER.mp4
          test -s public/production/EP01-STORY-RUNNER.json
          test -s public/production/EP01-STORY-RUNNER.otio
          bun x tsx scripts/validate-production-artifact.ts
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate -of json public/production/EP01-STORY-RUNNER.mp4 > public/production/EP01-STORY-RUNNER.ffprobe.json
          mediainfo public/production/EP01-STORY-RUNNER.mp4 > public/production/EP01-STORY-RUNNER.mediainfo.txt
      - name: Upload Story Runner
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-RUNNER
          path: |
            public/production/EP01-STORY-RUNNER.mp4
            public/production/EP01-STORY-RUNNER.json
            public/production/EP01-STORY-RUNNER.otio
            public/production/production-artifact-qc.json
            public/production/EP01-STORY-RUNNER.ffprobe.json
            public/production/EP01-STORY-RUNNER.mediainfo.txt
            production/EP01/generated/blender/ep01_subjectivity.mp4
            production/EP01/generated/blender/subjectivity-qc.json
            production/EP01/generated/comic/bannon-the-bastard-terminal.svg
            production/EP01/generated/comic/ep01_bastard_tag.mp4
            production/EP01/generated/comic/ep01_bastard_tag.ffprobe.json
          if-no-files-found: error
          retention-days: 30