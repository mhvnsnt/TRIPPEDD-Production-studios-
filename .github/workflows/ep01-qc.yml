name: EP01 Technical QC

on:
  workflow_run:
    workflows: ["EP01 Story Runner Cut"]
    types: [completed]

concurrency:
  group: ep01-qc-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  qc:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download completed Story Runner artifact
        uses: actions/download-artifact@v5
        with:
          name: EP01-STORY-RUNNER
          path: qc-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo

      - name: Run technical QC
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p qc-output
          video="qc-input/public/production/EP01-STORY-RUNNER.mp4"
          test -s "$video"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,avg_frame_rate -of json "$video" > qc-output/EP01-STORY-RUNNER.ffprobe.json
          mediainfo "$video" > qc-output/EP01-STORY-RUNNER.mediainfo.txt
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('qc-output/EP01-STORY-RUNNER.ffprobe.json').read_text())
          duration=float(data.get('format',{}).get('duration',0) or 0)
          size=int(data.get('format',{}).get('size',0) or 0)
          streams=data.get('streams',[])
          if duration <= 0 or size <= 0 or not streams:
              raise SystemExit('QC failed: invalid media probe')
          if not any(s.get('codec_type') == 'video' for s in streams):
              raise SystemExit('QC failed: no video stream')
          Path('qc-output/EP01-QC-PASS.json').write_text(json.dumps({
              'episodeId':'EP01','status':'PASS','workflowRunId':int('${RUN_ID}'),
              'checkedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'artifact':'EP01-STORY-RUNNER','durationSeconds':duration,'bytes':size,
              'streams':streams
          },indent=2)+'\n')
          PY

      - name: Publish QC result
        uses: actions/upload-artifact@v4
        with:
          name: EP01-QC-${{ github.event.workflow_run.id }}
          path: qc-output/
          if-no-files-found: error
          retention-days: 30

      - name: Report progress
        run: |
          {
            echo "## EP01 Technical QC"
            echo "- Story Runner run: ${{ github.event.workflow_run.id }}"
            echo "- Status: PASS"
            echo "- Next gate: editorial/showrunner review"
          } >> "$GITHUB_STEP_SUMMARY"
