<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>In the Bushes original title card</title>
<rect width="1920" height="1080" fill="#0a0d12"/>
<g opacity=".9" fill="#263925" stroke="#111810" stroke-width="18"><circle cx="1530" cy="760" r="250"/><circle cx="1690" cy="720" r="260"/><circle cx="1810" cy="800" r="190"/></g>
<g transform="translate(960 500)" text-anchor="middle" font-family="sans-serif" font-weight="900"><text y="0" fill="#f2f2f2" font-size="142" letter-spacing="5">IN THE BUSHES</text><text y="65" fill="#a9b0b8" font-size="28" letter-spacing="9">AN ORIGINAL ANIMATED SERIES</text></g>
