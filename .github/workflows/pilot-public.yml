name: EP01 Public Drive Build

on:
  workflow_dispatch:
  push:
    paths:
      - production/EP01/RUN-PUBLIC-BUILD
      - .github/workflows/pilot-public.yml
      - scripts/run-public-pilot.ts
      - src/server/publicDriveFolder.ts
      - src/server/queueManager.ts
      - src/server/mediaPipeline.ts
      - src/server/pilotRenderer.ts

permissions:
  contents: read

jobs:
  build-ep01:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install full open-source media stack
        run: |
          python -m pip install --upgrade pip
          # Credential-free public Drive ingestion.
          # PySceneDetect = shot boundaries.
          # OpenCV = frame sampling / visual measurements.
          # OpenAI Whisper = baseline local transcription.
          # All independent analysis stages run concurrently in mediaPipeline.ts.
          python -m pip install 'gdown>=6.1.0' 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'openai-whisper>=20240930'
          python -m scenedetect --version
          python -m gdown --version
          python -c "import cv2; print('OpenCV', cv2.__version__)"
          python -c "import whisper; print('Whisper import OK')"

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Verify public Drive access path
        run: python -m gdown --version

      - name: Build EP01 from public Drive footage
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_ENABLE_WHISPER: 'true'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
        run: timeout 150m bun run pilot:build:public

      - name: Verify first assembly exists
        run: |
          test -s public/production/EP01-first-assembly.mp4
          test -s public/production/EP01-first-assembly.json
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json public/production/EP01-first-assembly.mp4

      - name: Upload EP01 first assembly
        uses: actions/upload-artifact@v4
        with:
          name: EP01-first-assembly
          path: |
            public/production/EP01-first-assembly.mp4
            public/production/EP01-first-assembly.json
          if-no-files-found: error
