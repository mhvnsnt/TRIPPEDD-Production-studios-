<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Lower-Third Control</title>
	<style>
		body { font-family: sans-serif; padding: 12px; }
		label { display: block; margin: 8px 0; }
	</style>
</head>
<body>
	<h3>TRIPPEDD Lower-Third</h3>
	<label>Name <input id="name" value="ASHES"></label>
	<label>Title <input id="title" value="TRIPPEDD STATION IDENT"></label>
	<button id="push">Push to graphic</button>
	<script>
		const rep = nodecg.Replicant('lowerThird');
		document.getElementById('push').addEventListener('click', () => {
			rep.value = {
				name: document.getElementById('name').value,
				title: document.getElementById('title').value
			};
		});
	</script>
</body>
</html>
