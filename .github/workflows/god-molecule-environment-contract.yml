name: god-molecule-environment-contract

on:
  push:
    paths:
      - "config/god_molecule_environment_stack.json"
      - "config/production/worker-capability-registry.json"
      - "config/god_molecule_open_source.yaml"
      - "tools/environment/**"
      - ".github/workflows/god-molecule-environment-contract.yml"
  pull_request:
    paths:
      - "config/god_molecule_environment_stack.json"
      - "config/production/worker-capability-registry.json"
      - "config/god_molecule_open_source.yaml"
      - "tools/environment/**"
      - ".github/workflows/god-molecule-environment-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON contracts
        run: |
          python -m json.tool config/god_molecule_environment_stack.json >/dev/null
          python -m json.tool config/production/worker-capability-registry.json >/dev/null
      - name: Compile environment adapter
        run: python -m py_compile tools/environment/build_environment_slice.py tools/environment/build_memory_safe_scene.py
      - name: Execute deterministic environment planning smoke test
        run: |
          python tools/environment/build_environment_slice.py             --seed GOD-MOLECULE-CI-001             --scene ci_environment             --output /tmp/god-molecule-environment.json
          python -m json.tool /tmp/god-molecule-environment.json >/dev/null
      - name: Assert no false creative completion
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/god-molecule-environment.json"))
          assert p["claims"]["environment_rendered"] is False
          assert p["claims"]["gaussian_splat_verified"] is False
          assert p["claims"]["creative_final"] is False
          assert p["world_seed"] == "GOD-MOLECULE-CI-001"
          print("ENVIRONMENT_CONTRACT: PASS")
          PY
