name: Production Short E2E Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/network-ident/**'
      - 'config/production/**'
      - '.github/workflows/production-short-e2e-gate.yml'
      - 'scripts/production/**'
      - 'scripts/run-public-pilot.ts'
      - 'scripts/validate-production-artifact.ts'
      - 'src/core/pipeline/**'
      - 'src/core/editorial/**'

concurrency:
  group: production-short-e2e-gate
  cancel-in-progress: false

permissions:
  contents: read

# HARD GATE: one continuous authored commercial must traverse the same OSS
# ingest -> analysis -> editorial -> render -> QC -> delivery path used by EP01.

jobs:
  short-e2e:
    name: 20-second TRIPPEDD network commercial proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media/render stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo exiftool imagemagick curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0 tesseract-ocr rclone
          python -m pip install --upgrade pip
          python -m pip install -r config/production/oss-stack.requirements.txt
      - name: Install production dependencies
        run: bun install --no-save
      - name: Install and verify Blender
        env:
          BLENDER_VERSION: '4.5.13'
          BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd
          curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#$HOME/.cache/trippedd/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Verify open-source stack before production work
        run: |
          set -euo pipefail
          bash scripts/production/verify-oss-stack.sh
          mediainfo --Version
          exiftool -ver
          convert -version | head -n 1
      - name: Build continuous authored network commercial source
        env:
          TRIPPEDD_FRAME_START: '1'
          TRIPPEDD_FRAME_END: '480'
          TRIPPEDD_PROOF_FAST: 'true'
        run: |
          set -euo pipefail
          rm -rf production/network-ident/generated
          blender -b --python production/network-ident/build_network_ident.py
          frames=$(find production/network-ident/generated/frames -maxdepth 1 -type f -name 'frame-*.png' -size +0c | wc -l)
          test "$frames" -eq 480
          test "$(find production/network-ident/generated/frames -maxdepth 1 -type f -name 'frame-*.png' -size 0c | wc -l)" -eq 0
          ffmpeg -y -hide_banner -loglevel error \
            -framerate 24 -start_number 1 \
            -i production/network-ident/generated/frames/frame-%04d.png \
            -f lavfi -i "sine=frequency=220:sample_rate=48000" \
            -t 20 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -shortest \
            /tmp/trippedd-network-ident-source.mp4
          mkdir -p /tmp/trippedd-e2e-source
          cp /tmp/trippedd-network-ident-source.mp4 /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json /tmp/trippedd-network-ident-source.mp4 > /tmp/trippedd-e2e-source/ffprobe.json
          mediainfo --Output=JSON /tmp/trippedd-network-ident-source.mp4 > /tmp/trippedd-e2e-source/mediainfo.json
          exiftool -j /tmp/trippedd-network-ident-source.mp4 > /tmp/trippedd-e2e-source/exiftool.json
          sha256sum /tmp/trippedd-network-ident-source.mp4 > /tmp/trippedd-e2e-source/source.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/trippedd-e2e-source/ffprobe.json').read_text())
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          assert int(v['width']) >= 1280 and int(v['height']) >= 720
          assert v['r_frame_rate'] == '24/1'
          assert 19.9 <= float(d['format']['duration']) <= 20.1
          assert int(d['format']['size']) > 0
          print('AUTHORED_NETWORK_COMMERCIAL_SOURCE=PASS')
          PY
      - name: Run actual source-analysis and editorial assembly path
        env:
          TRIPPEDD_TEST_MODE: 'true'
          TRIPPEDD_TEST_SOURCE_DIR: /tmp/trippedd-e2e-source
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_OUTPUT_DIR: ${{ github.workspace }}/public/production
          TRIPPEDD_OUTPUT_BASENAME: TRIPPEDD-NETWORK-IDENT-E2E
          TRIPPEDD_EXPECTED_SOURCE_FILES: '1'
          TRIPPEDD_CUT_MODE: SHOWRUNNER
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_ENABLE_WHISPER: 'true'
          WHISPER_MODEL: tiny
          TRIPPEDD_WHISPER_DEVICE: cpu
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          EP01_MAX_CLIPS: '1'
          EP01_CLIP_PADDING: '0'
          EP01_RENDER_CONCURRENCY: '1'
        run: timeout 15m bun run pilot:build:public
      - name: Validate final commercial with production QC
        env:
          TRIPPEDD_OUTPUT_BASENAME: TRIPPEDD-NETWORK-IDENT-E2E
        run: |
          set -euo pipefail
          bun run pilot:validate
          test -s public/production/TRIPPEDD-NETWORK-IDENT-E2E.mp4
          test -s public/production/TRIPPEDD-NETWORK-IDENT-E2E.json
          test -s public/production/TRIPPEDD-NETWORK-IDENT-E2E.otio
          test -s public/production/production-artifact-qc.json
          sha256sum public/production/TRIPPEDD-NETWORK-IDENT-E2E.mp4 > public/production/TRIPPEDD-NETWORK-IDENT-E2E.mp4.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          qc=json.loads(Path('public/production/production-artifact-qc.json').read_text())
          assert qc['status']=='PASS', qc
          media=qc['cuts']['TRIPPEDD-NETWORK-IDENT-E2E']
          assert 19.9 <= media['duration'] <= 20.1, media
          assert media['video']['width'] >= 1280 and media['video']['height'] >= 720, media
          assert abs(media['video']['fps']-24) < 0.05, media
          assert media['audio'] and media['audio']['sampleRate'] >= 44100, media
          print('TRIPPEDD_NETWORK_COMMERCIAL_GATE=PASS')
          print(json.dumps(media, indent=2))
          PY
      - name: Verify OTIO is parseable and represents one continuous source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('public/production/TRIPPEDD-NETWORK-IDENT-E2E.otio').read_text())
          assert data['OTIO_SCHEMA']=='Timeline.1'
          tracks=data.get('tracks', [])
          assert tracks and tracks[0]['children']
          children=tracks[0]['children']
          assert len(children) == 1, children
          print('OTIO_PARSE=PASS')
          print('OTIO_CONTINUITY=PASS clips=1')
          PY
      - name: Upload network commercial proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TRIPPEDD-NETWORK-COMMERCIAL-E2E-PROOF
          path: |
            public/production/TRIPPEDD-NETWORK-IDENT-E2E.mp4
            public/production/TRIPPEDD-NETWORK-IDENT-E2E.mp4.sha256
            public/production/TRIPPEDD-NETWORK-IDENT-E2E.json
            public/production/TRIPPEDD-NETWORK-IDENT-E2E.otio
            public/production/production-artifact-qc.json
            /tmp/trippedd-e2e-source/ffprobe.json
            /tmp/trippedd-e2e-source/mediainfo.json
            /tmp/trippedd-e2e-source/exiftool.json
            /tmp/trippedd-e2e-source/source.sha256
            production/network-ident/generated/network-ident-0001-0480.blend
          if-no-files-found: error
          retention-days: 30
