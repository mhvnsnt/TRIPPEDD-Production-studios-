<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Voice Timeline Mover</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0d0d0d; color: #eee; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
  #topbar { display: flex; align-items: center; gap: 6px; padding: 10px; background: #1a1a1a; position: sticky; top: 0; z-index: 200; flex-wrap: wrap; }
  #topbar button { padding: 12px 14px; font-size: 15px; border: none; border-radius: 8px; font-weight: bold; touch-action: manipulation; }
  #playbtn { background: #2e7d32; color: white; min-width: 64px; }
  #stopbtn { background: #555; color: white; }
  #splitbtn2 { background: #1565c0; color: white; }
  #delbtn { background: #c62828; color: white; }
  #exportbtn { background: #ef6c00; color: white; }
  #time-display { font-size: 17px; font-weight: bold; color: #ffeb3b; font-variant-numeric: tabular-nums; padding: 0 4px; }
  #timeline-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; position: relative; background: #141414; }
  #timeline { position: relative; }
  canvas { display: block; touch-action: none; }
  #status { padding: 8px 12px; font-size: 12px; color: #888; background: #1a1a1a; line-height: 1.5; }
  #out { display: none; background: #222; margin: 8px; padding: 10px; border-radius: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; }
  .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 12px; }
  .loading .bar { width: 220px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
  .loading .fill { height: 100%; background: #2e7d32; width: 0%; transition: width 0.2s; }
  .clip-label { position: absolute; font-size: 10px; font-weight: bold; color: #fff; padding: 2px 4px; pointer-events: none; z-index: 60; text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<div class="loading" id="loader"><div style="font-size:16px">Loading voice clips...</div><div class="bar"><div class="fill" id="loadfill"></div></div><div id="loadtxt" style="font-size:12px;color:#888"></div></div>
<div id="topbar">
  <button id="playbtn">▶</button>
  <button id="stopbtn">■</button>
  <div id="time-display">0:00.0</div>
  <button id="splitbtn2">✂ SPLIT</button>
  <button id="delbtn">🗑 DEL</button>
  <button id="exportbtn">⤴ EXPORT</button>
</div>
<div id="timeline-scroll"><div id="timeline"></div></div>
<div id="status">Tap timeline = seek &amp; play from there &nbsp;•&nbsp; Drag clip = move &nbsp;•&nbsp; Drag white edges = trim &nbsp;•&nbsp; Tap clip = select, then SPLIT or DEL</div>
<div id="out"></div>

<script>
const COMPOSITE_URL = "https://muse.ai/files/1299464149925011/2387017855165052/fc3g6bh3a1ozbp7lun9kqr34/ep01_all_clips.wav";
const DUR = 301, PX_PER_SEC = 6, TRACK_H = 64, RULER_H = 30;

// clip index: key -> {offset, duration} in composite file
const CLIP_INDEX = {
 "yes": {"offset": 0.0, "duration": 0.512},
 "itstime": {"offset": 1.012, "duration": 0.683},
 "thewizards": {"offset": 2.195, "duration": 0.683},
 "have": {"offset": 3.377, "duration": 0.256},
 "arrived_trimmed": {"offset": 4.133, "duration": 0.768},
 "static_laugh": {"offset": 5.401, "duration": 6.2},
 "cipher_laugh": {"offset": 12.101, "duration": 2.0},
 "chain_rattle_5s": {"offset": 14.601, "duration": 5.0},
 "sombra_33": {"offset": 20.101, "duration": 1.4},
 "kiko_39_mix": {"offset": 22.001, "duration": 3.12},
 "ashes_42": {"offset": 25.621, "duration": 1.04},
 "crowd_laugh_mix": {"offset": 27.161, "duration": 5.76},
 "crowd_huh_mix": {"offset": 33.421, "duration": 2.04},
 "crowd_gasp_mix": {"offset": 35.961, "duration": 3.44},
 "static_100": {"offset": 39.901, "duration": 4.2},
 "ashes_105": {"offset": 44.601, "duration": 1.64},
 "onyx_108": {"offset": 46.741, "duration": 0.6},
 "cityisours": {"offset": 47.841, "duration": 1.109},
 "werulethenight": {"offset": 49.451, "duration": 1.011},
 "cipher_135": {"offset": 50.961, "duration": 2.76},
 "ashes_140": {"offset": 54.221, "duration": 2.68},
 "static_204": {"offset": 57.401, "duration": 2.48},
 "static_218": {"offset": 60.381, "duration": 2.56},
 "ovation_5s": {"offset": 63.441, "duration": 5.0},
 "bball_9s": {"offset": 68.941, "duration": 9.0},
 "static_240": {"offset": 78.441, "duration": 5.32},
 "cipher_257": {"offset": 84.261, "duration": 2.2},
 "theory_304": {"offset": 86.961, "duration": 4.76},
 "cipher_339": {"offset": 92.221, "duration": 4.32},
 "static_338": {"offset": 97.041, "duration": 7.56},
 "sombra_350": {"offset": 105.101, "duration": 1.8},
 "kiko_402_mix": {"offset": 107.401, "duration": 2.2},
 "kiko_408_mix": {"offset": 110.101, "duration": 1.84},
 "fireworks_10s": {"offset": 112.441, "duration": 10.0},
 "ashes_437": {"offset": 122.941, "duration": 3.44},
 "uzi_outro": {"offset": 126.881, "duration": 8.0}
};

const TRACK_COLORS = {
  ashes:'#7b1fa2', static:'#1565c0', cipher:'#2e7d32', sombra:'#5d1a1a',
  kiko:'#e65100', theory:'#00838f', onyx:'#4e342e', crowd:'#37474f',
  sfx:'#455a64', music:'#1b5e20'
};

let audioCtx, compBuffer, compPeaks;
let clips = [];
let selected = null, isPlaying = false, playStartCtxT = 0, playStartOffset = 0, sources = [];
let playheadT = 0;

function fmt(t) { return Math.floor(t/60) + ':' + (t%60).toFixed(1).padStart(4,'0'); }

// ===== TIMELINE DEFS (v5 positions) =====
const TIMELINE = [
  ['yes','yes',1.9,'ASHES','ashes',"yes"],
  ['itstime','itstime',5.5,'ASHES','ashes',"it's time"],
  ['thewizards','thewizards',8.3,'ASHES','ashes',"the wizards"],
  ['have','have',10.9,'ASHES','ashes',"have"],
  ['arrived','arrived_trimmed',15.5,'ASHES','ashes',"arrived"],
  ['static_laugh','static_laugh',20.5,'STATIC','static',"laughing"],
  ['cipher_laugh','cipher_laugh',20.5,'CIPHER','cipher',"laughing"],
  ['chain','chain_rattle_5s',27.0,'SFX','sfx',"chain rattle"],
  ['sombra33','sombra_33',33.0,'SOMBRA','sombra',"been here before"],
  ['kiko39','kiko_39_mix',39.0,'KIKO','kiko',"Check out my robe!"],
  ['ashes42','ashes_42',42.0,'ASHES','ashes',"WIZARD GANG!"],
  ['crowd_laugh','crowd_laugh_mix',50.0,'CROWD','crowd',"laughing"],
  ['crowd_huh','crowd_huh_mix',52.0,'CROWD','crowd','"huh?"'],
  ['crowd_gasp','crowd_gasp_mix',53.0,'CROWD','crowd',"gasping"],
  ['static100','static_100',60.0,'STATIC','static',"bunch of wizards"],
  ['ashes105','ashes_105',65.8,'ASHES','ashes',"Council is in session"],
  ['onyx','onyx_108',67.5,'ONYX','onyx',"yes"],
  ['cityisours','cityisours',80.3,'ASHES','ashes',"The City is ours!"],
  ['werulethenight','werulethenight',82.9,'ASHES','ashes',"We rule the night!"],
  ['cipher135','cipher_135',95.0,'CIPHER','cipher',"manic giggling"],
  ['ashes140','ashes_140',101.6,'ASHES','ashes',"propane..."],
  ['static204','static_204',124.5,'STATIC','static',"burnin the burgers"],
  ['static218','static_218',138.0,'STATIC','static',"That's not even us!"],
  ['ovation','ovation_5s',147.0,'SFX','sfx',"ovation"],
  ['bball','bball_9s',151.0,'SFX','sfx',"basketball"],
  ['static240','static_240',160.5,'STATIC','static',"baconeggandcheese"],
  ['cipher257','cipher_257',177.0,'CIPHER','cipher',"he sees you..."],
  ['theory304','theory_304',184.0,'THEORY','theory',"don't touch that!"],
  ['cipher339','cipher_339',207.1,'CIPHER','cipher',"cuts cuts cuts"],
  ['static338','static_338',218.0,'STATIC','static',"Static in the building"],
  ['sombra350','sombra_350',230.0,'SOMBRA','sombra',"ah, this is nice"],
  ['kiko402','kiko_402_mix',242.0,'KIKO','kiko',"check out my robe guys"],
  ['kiko408','kiko_408_mix',248.0,'KIKO','kiko',"isn't it? Come on"],
  ['fireworks','fireworks_10s',250.0,'SFX','sfx',"fireworks"],
  ['ashes437','ashes_437',279.3,'ASHES','ashes',"hell of a night"],
  ['uzi','uzi_outro',295.0,'MUSIC','music',"Uzi Shoulder"],
];

async function loadAll() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('loadtxt').textContent = 'downloading...';
  const res = await fetch(COMPOSITE_URL);
  const total = +res.headers.get('content-length') || 11000000;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    document.getElementById('loadfill').style.width = (got/total*100) + '%';
  }
  const ab = new Blob(chunks).arrayBuffer();
  document.getElementById('loadtxt').textContent = 'decoding...';
  compBuffer = await audioCtx.decodeAudioData(await ab);
  compPeaks = computePeaks(compBuffer);
  document.getElementById('loader').style.display = 'none';
  initClips();
  render();
}

function computePeaks(buf) {
  const d = buf.getChannelData(0), peaks = [];
  const bs = Math.max(1, Math.floor(d.length / 3000));
  for (let i = 0; i < d.length; i += bs) {
    let m = 0;
    for (let j = i; j < Math.min(i+bs, d.length); j++) m = Math.max(m, Math.abs(d[j]));
    peaks.push(m);
  }
  return { peaks, total: d.length, sr: buf.sampleRate };
}

function initClips() {
  const trackEnd = [];
  TIMELINE.forEach(d => {
    const idx = CLIP_INDEX[d[1]];
    if (!idx) return;
    const dur = idx.duration;
    let track = 0;
    while (trackEnd[track] > d[2]) track++;
    trackEnd[track] = d[2] + dur;
    clips.push({ id: d[0], key: d[1], compOffset: idx.offset, t: d[2], dur,
      srcOffset: 0, fullDur: dur, char: d[3], color: TRACK_COLORS[d[4]], line: d[5], track });
  });
}

// ===== RENDER =====
const tl = document.getElementById('timeline');
const scrollEl = document.getElementById('timeline-scroll');
let canvas, ctx;

function render() {
  const W = DUR * PX_PER_SEC + 40;
  const numTracks = clips.length ? Math.max(...clips.map(c => c.track)) + 1 : 1;
  const H = RULER_H + numTracks * TRACK_H + 16;
  tl.style.width = W + 'px'; tl.style.height = H + 'px';
  tl.innerHTML = '';
  canvas = document.createElement('canvas');
  canvas.width = W * 2; canvas.height = H * 2;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  tl.appendChild(canvas);
  ctx = canvas.getContext('2d'); ctx.scale(2, 2);

  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, W, RULER_H);
  ctx.fillStyle = '#999'; ctx.font = '10px sans-serif';
  for (let s = 0; s <= DUR; s += 10) {
    const x = s * PX_PER_SEC;
    ctx.fillStyle = '#444'; ctx.fillRect(x, 0, 1, s % 30 === 0 ? RULER_H : 12);
    if (s % 30 === 0) { ctx.fillStyle = '#999'; ctx.fillText(fmt(s), x + 4, 16); }
  }
  // track separators
  for (let i = 0; i < numTracks; i++) {
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, RULER_H + i * TRACK_H, W, TRACK_H);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, RULER_H + i * TRACK_H, W, 1);
  }

  clips.forEach(c => {
    const x = c.t * PX_PER_SEC, w = Math.max(c.dur * PX_PER_SEC, 8);
    const y = RULER_H + c.track * TRACK_H + 5, h = TRACK_H - 10;
    ctx.fillStyle = c.color; ctx.globalAlpha = 0.9;
    rr(x, y, w, h, 5); ctx.fill(); ctx.globalAlpha = 1;
    if (selected === c) { ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; rr(x, y, w, h, 5); ctx.stroke(); }
    // waveform from composite
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const startSamp = Math.floor((c.compOffset + c.srcOffset) * compPeaks.sr);
    const endSamp = Math.floor((c.compOffset + c.srcOffset + c.dur) * compPeaks.sr);
    const pxPerPeak = compPeaks.total / compPeaks.peaks.length;
    const si = Math.floor(startSamp / pxPerPeak), ei = Math.floor(endSamp / pxPerPeak);
    const n = Math.max(ei - si, 1);
    const step = Math.max(1, Math.floor(w / n));
    for (let px = 0; px < w; px += step) {
      const pi = si + Math.floor(px / w * n);
      const p = (compPeaks.peaks[pi] || 0);
      const bh = Math.max(1, p * (h - 10));
      ctx.fillRect(x + px, y + h/2 - bh/2, step, bh);
    }
    // trim handles
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 5, h); ctx.fillRect(x + w - 5, y, 5, h);
    const label = document.createElement('div');
    label.className = 'clip-label';
    label.style.left = (x + 8) + 'px'; label.style.top = (y + 3) + 'px';
    label.style.maxWidth = (w - 16) + 'px';
    label.textContent = c.char + ' ' + fmt(c.t);
    tl.appendChild(label);
  });

  // playhead
  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(playheadT * PX_PER_SEC - 1, 0, 2, H);
  document.getElementById('time-display').textContent = fmt(playheadT);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ===== INTERACTION =====
let dragMode = null, dragClip = null, dragStartX = 0, oT = 0, oD = 0, oS = 0;

function posFromEvent(e) {
  const r = tl.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

tl.addEventListener('pointerdown', e => {
  const { x, y } = posFromEvent(e);
  const c = [...clips].reverse().find(c => {
    const cx = c.t * PX_PER_SEC, cw = Math.max(c.dur * PX_PER_SEC, 8);
    const cy = RULER_H + c.track * TRACK_H + 5;
    return x >= cx && x <= cx + cw && y >= cy && y <= cy + TRACK_H - 10;
  });
  if (c) {
    const cx = c.t * PX_PER_SEC, cw = Math.max(c.dur * PX_PER_SEC, 8);
    selected = c;
    if (x - cx < 12) dragMode = 'trimL';
    else if (cx + cw - x < 12) dragMode = 'trimR';
    else dragMode = 'move';
    dragClip = c; dragStartX = e.clientX; oT = c.t; oD = c.dur; oS = c.srcOffset;
    canvas.setPointerCapture(e.pointerId);
  } else {
    playheadT = Math.max(0, Math.min(DUR, x / PX_PER_SEC));
    selected = null;
    if (isPlaying) { pause(); play(); }
  }
  render();
});

tl.addEventListener('pointermove', e => {
  if (!dragMode || !dragClip) return;
  const dx = (e.clientX - dragStartX) / PX_PER_SEC;
  const c = dragClip;
  if (dragMode === 'move') {
    c.t = Math.max(0, Math.min(DUR - c.dur, oT + dx));
  } else if (dragMode === 'trimL') {
    const nt = Math.max(0, Math.min(oT + oD - 0.15, oT + dx));
    const d = nt - oT;
    if (oS + d >= 0) { c.t = nt; c.dur = oD - d; c.srcOffset = oS + d; }
  } else if (dragMode === 'trimR') {
    c.dur = Math.max(0.15, Math.min(c.fullDur - c.srcOffset, oD + dx));
  }
  render();
});

tl.addEventListener('pointerup', () => { dragMode = null; dragClip = null; });

// ===== PLAYBACK =====
function play() {
  if (isPlaying) { pause(); return; }
  audioCtx.resume();
  isPlaying = true;
  playStartCtxT = audioCtx.currentTime + 0.05;
  playStartOffset = playheadT;
  document.getElementById('playbtn').textContent = '⏸';
  sources = [];
  clips.forEach(c => {
    const dt = c.t - playheadT;
    const skip = Math.max(0, playheadT - c.t);
    const dur = c.dur - skip;
    if (dur <= 0.05) return;
    const src = audioCtx.createBufferSource();
    src.buffer = compBuffer;
    src.connect(audioCtx.destination);
    try { src.start(playStartCtxT + Math.max(0, dt), c.compOffset + c.srcOffset + skip, dur); }
    catch(e) {}
    sources.push(src);
  });
  requestAnimationFrame(tick);
}

function pause() {
  isPlaying = false;
  sources.forEach(s => { try { s.stop(); } catch(e) {} });
  sources = [];
  document.getElementById('playbtn').textContent = '▶';
}

function tick() {
  if (!isPlaying) return;
  playheadT = playStartOffset + (audioCtx.currentTime - playStartCtxT);
  if (playheadT >= DUR) { doStop(); return; }
  render();
  const px = playheadT * PX_PER_SEC;
  if (px > scrollEl.scrollLeft + scrollEl.clientWidth - 120) scrollEl.scrollLeft = px - 120;
  requestAnimationFrame(tick);
}

function doStop() {
  pause(); playheadT = 0; scrollEl.scrollLeft = 0; render();
}

document.getElementById('playbtn').addEventListener('click', play);
document.getElementById('stopbtn').addEventListener('click', doStop);

document.getElementById('splitbtn2').addEventListener('click', () => {
  if (!selected) return;
  const c = selected, off = playheadT - c.t;
  if (off <= 0.15 || off >= c.dur - 0.15) return;
  const right = { id: c.id + '_b', key: c.key, compOffset: c.compOffset,
    t: playheadT, dur: c.dur - off, srcOffset: c.srcOffset + off, fullDur: c.fullDur,
    char: c.char, color: c.color, line: c.line + ' (2)', track: c.track };
  c.dur = off; c.line = c.line + ' (1)';
  // find free track for right piece
  let tr = 0;
  const others = clips.filter(x => x !== c);
  while (others.some(x => x.track === tr && x.t < right.t + right.dur && x.t + x.dur > right.t)) tr++;
  right.track = tr;
  clips.push(right);
  selected = null;
  render();
});

document.getElementById('delbtn').addEventListener('click', () => {
  if (!selected) return;
  clips = clips.filter(c => c !== selected);
  selected = null;
  render();
});

document.getElementById('exportbtn').addEventListener('click', () => {
  let txt = 'EP01 DIALOGUE TIMELINE (updated)\n';
  [...clips].sort((a,b) => a.t - b.t).forEach(c => {
    txt += c.id + '|' + c.t.toFixed(1) + '|' + c.dur.toFixed(2) + '|' + c.key + '|' + c.srcOffset.toFixed(2) + '|' + c.char + '|' + c.line + '\n';
  });
  const out = document.getElementById('out');
  out.style.display = 'block'; out.textContent = txt;
  navigator.clipboard.writeText(txt);
  document.getElementById('exportbtn').textContent = 'COPIED!';
  setTimeout(() => document.getElementById('exportbtn').textContent = '⤴ EXPORT', 2000);
});

loadAll();
</script>
</body>
</html>
