name: Production Studio Upgrade CI

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/production-pipeline-speed-2026-09-08
    paths:
      - src/**
      - scripts/**
      - config/**
      - package.json
      - bun.lockb
      - .github/workflows/studio-upgrade-ci.yml

concurrency:
  group: studio-upgrade-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline open-source analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'faster-whisper>=1.2.0' 'opentimelineio>=0.17.0'
      - name: Install Node dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Audit production toolchain
        run: bun run studio:audit
      - name: Validate evidence/provenance contracts
        run: |
          bun run studio:test:evidence-cache
          bun run studio:test:provenance
