name: MARS Oral Recovery Probe

on:
  push:
    paths:
      - "tools/character/swap_oral_interior_onto_donor_head.py"
      - "tools/character/run_oral_interior_swap.sh"
      - "assets/rigs/MARS_FACE.blend"
      - "assets/checkpoints/before-mouth-retopo/**"
      - ".github/workflows/mars-oral-recovery.yml"
      - "tools/character/inspect_original_mars_glb.py"
      - "assets/rigs/MARS_FACE.glb"
  workflow_dispatch:

jobs:
  oral-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Blender
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils libgl1 libegl1 libx11-6 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0
          mkdir -p vendor
          curl -L --fail --retry 4 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.1-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C vendor
          ln -sfn "$PWD/vendor/blender-4.2.1-linux-x64/blender" "$PWD/vendor/blender"
          vendor/blender --version

      - name: Extract the known-good Sep 12 visual anchor
        run: |
          set -euo pipefail
          mkdir -p .artifacts/oral
          git fetch --no-tags --depth=1 origin 800c8bc2ba544390f3d9df9cc9c147aea6520aeb
          git show 800c8bc2ba544390f3d9df9cc9c147aea6520aeb:docs/evidence/mouth/03_WIDE_mouth.png > .artifacts/oral/historical_800c_03_WIDE_mouth.png
          file .artifacts/oral/historical_800c_03_WIDE_mouth.png
      - name: Inspect the original original MARS_FACE GLB
        run: |
          set -euo pipefail
          mkdir -p .artifacts/original-glb
          test -s assets/rigs/MARS_FACE.glb
          sha256sum assets/rigs/MARS_FACE.glb | tee .artifacts/original-glb/MARS_FACE.glb.sha256
          vendor/blender -b -P tools/character/inspect_original_mars_glb.py -- --glb assets/rigs/MARS_FACE.glb --out .artifacts/original-glb
          cp assets/rigs/MARS_FACE.glb .artifacts/original-glb/MARS_FACE_original.glb
          cat .artifacts/original-glb/inventory.json

      - name: Verify immutable host anchors
        run: |
          set -euo pipefail
          test -s assets/checkpoints/before-mouth-retopo/assets/rigs/MARS_FACE.blend
          test -s assets/rigs/MARS_FACE.blend
          CHECKPOINT_BLOB=$(git rev-parse HEAD:assets/checkpoints/before-mouth-retopo/assets/rigs/MARS_FACE.blend)
          echo "MARS_FACE_CHECKPOINT_GIT_BLOB=$CHECKPOINT_BLOB"
          sha256sum assets/checkpoints/before-mouth-retopo/assets/rigs/MARS_FACE.blend assets/rigs/MARS_FACE.blend

      - name: Inventory host and current interior before mutation
        run: |
          set -euo pipefail
          mkdir -p .artifacts/oral
          vendor/blender -b -P tools/character/swap_oral_interior_onto_donor_head.py -- --list-only --host assets/checkpoints/before-mouth-retopo/assets/rigs/MARS_FACE.blend --interior assets/rigs/MARS_FACE.blend > .artifacts/oral/inventory.txt
          cat .artifacts/oral/inventory.txt

      - name: Assemble review-only donor host plus current interior
        id: swap
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .artifacts/oral
          vendor/blender -b -P tools/character/swap_oral_interior_onto_donor_head.py -- \
            --host assets/checkpoints/before-mouth-retopo/assets/rigs/MARS_FACE.blend \
            --interior assets/rigs/MARS_FACE.blend \
            --out .artifacts/oral/MARS_FACE_ORAL_ASSEMBLY_REVIEW.blend \
            --report .artifacts/oral/oral_interior_swap_report.json | tee .artifacts/oral/swap.log

      - name: Materialize committed mouth measurement inputs
        if: steps.swap.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p renders/_rig_measure
          cp docs/evidence/linework/mouth_anatomy.json renders/_rig_measure/mouth_anatomy.json
          cp docs/evidence/linework/face_anatomy.json renders/_rig_measure/face_anatomy.json
      - name: Run mouth pixel/material proof on review artifact
        if: steps.swap.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          mkdir -p .artifacts/oral/mouth-proof
          vendor/blender -b -P tools/character/mouth_proof.py -- \
            --rig .artifacts/oral/MARS_FACE_ORAL_ASSEMBLY_REVIEW.blend \
            --out .artifacts/oral/mouth-proof \
            --only 03_WIDE | tee .artifacts/oral/mouth-proof.log
          status=${PIPESTATUS[0]}
          echo "MOUTH_PROOF_EXIT=$status" | tee .artifacts/oral/mouth-proof-status.txt
          exit 0
      - name: Package oral recovery evidence
        if: always()
        run: |
          set +e
          date -u +%FT%TZ > .artifacts/oral/completed_utc.txt
          find .artifacts/oral -type f -printf '%p %s bytes\n' | sort > .artifacts/oral/inventory-final.txt

      - name: Upload oral recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-oral-recovery-${{ github.run_id }}
          path: |
            .artifacts/oral
            .artifacts/original-glb
          if-no-files-found: error
          retention-days: 14
