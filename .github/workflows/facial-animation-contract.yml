name: Facial animation integration contract

on:
  pull_request:
    paths:
      - 'third_party/oss/facial-animation'
      - 'tools/character/facial_animation_bridge.py'
      - 'tools/character/test_facial_animation_bridge.py'
      - 'tools/oss/full_repo_registry.json'
      - '.gitmodules'
      - '.github/workflows/facial-animation-contract.yml'
  push:
    branches: [main]
    paths:
      - 'third_party/oss/facial-animation'
      - 'tools/character/facial_animation_bridge.py'
      - 'tools/character/test_facial_animation_bridge.py'
      - 'tools/oss/full_repo_registry.json'
      - '.gitmodules'
      - '.github/workflows/facial-animation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify whole-repository OSS registry
        run: python3 tools/oss/verify_full_repo_registry.py
      - name: Verify pinned upstream entrypoint
        run: |
          test -f third_party/oss/facial-animation/autorig.py
          grep -q 'Headless entry point' third_party/oss/facial-animation/autorig.py
      - name: Run bridge contract test
        run: python3 tools/character/test_facial_animation_bridge.py
