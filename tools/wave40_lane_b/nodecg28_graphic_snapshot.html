<!DOCTYPE html><html><head>
	<meta charset="utf-8">
	<title>Lower Third</title>
	<style>
		html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
		#lt {
			position: absolute; left: 120px; bottom: 120px;
			background: rgba(0,0,0,.82); color: #fff;
			border-left: 14px solid #e11d2e; padding: 24px 48px;
			font-family: 'Arial Black', sans-serif; opacity: 0; transition: opacity .4s;
		}
		#lt.show { opacity: 1; }
		#lt .name { font-size: 64px; letter-spacing: 4px; }
		#lt .title { font-size: 30px; color: #ffd23f; letter-spacing: 2px; }
	</style>
</head>
<body>
	<div id="lt"><div class="name" id="name"></div><div class="title" id="title"></div></div>
	<script>globalThis.ncgConfig = {"host":"0.0.0.0","port":9090,"baseURL":"localhost:9090","logging":{"console":{"enabled":true,"level":"info","timestamps":true,"replicants":false},"file":{"enabled":false,"level":"info","timestamps":true,"replicants":false}},"login":{"enabled":false},"sentry":{"enabled":false},"ssl":{"enabled":false}};</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/socket.js"></script>
<script src="/api.js"></script>
<script>globalThis.nodecg = new globalThis.NodeCG({"name":"trippedd-lowerthird","config":{},"version":"0.1.0","_hasSounds":false}, globalThis.socket)</script>
<script src="/client_registration.js"></script><script>
		const lt = document.getElementById('lt');
		nodecg.Replicant('lowerThird').on('change', (v) => {
			document.getElementById('name').textContent = v.name;
			document.getElementById('title').textContent = v.title;
			lt.classList.add('show');
		});
	</script>


</body></html>
