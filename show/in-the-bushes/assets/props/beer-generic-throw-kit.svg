<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <title>In the Bushes — Generic Beer Throw Kit</title>
  <desc>Original unbranded prop shapes for a six-pack, loose cans, and spill effects. No beverage-company branding.</desc>
  <rect width="1200" height="700" fill="none"/>
  <g stroke="#17191d" stroke-width="12" stroke-linejoin="round">
    <!-- generic six-pack carrier -->
    <g id="six-pack" transform="translate(100 120)">
      <path d="M20 150 Q20 115 55 115 H255 Q290 115 290 150 V330 Q290 365 255 365 H55 Q20 365 20 330 Z" fill="#d5d7d9"/>
      <path d="M55 115 V75 Q55 45 85 45 H225 Q255 45 255 75 V115" fill="none"/>
      <circle cx="85" cy="115" r="42" fill="#b8bbc0"/>
      <circle cx="155" cy="115" r="42" fill="#b8bbc0"/>
      <circle cx="225" cy="115" r="42" fill="#b8bbc0"/>
      <text x="65" y="255" font-family="sans-serif" font-size="28" fill="#17191d" stroke="none">GENERIC</text>
      <text x="68" y="292" font-family="sans-serif" font-size="28" fill="#17191d" stroke="none">SIX-PACK</text>
    </g>
    <!-- loose can -->
    <g id="can" transform="translate(510 150)">
      <path d="M30 45 Q30 20 55 20 H125 Q150 20 150 45 V250 Q150 275 125 275 H55 Q30 275 30 250 Z" fill="#c5c8cc"/>
      <ellipse cx="90" cy="45" rx="60" ry="18" fill="#dfe1e3"/>
      <ellipse cx="90" cy="250" rx="60" ry="18" fill="#aeb2b6"/>
      <text x="57" y="165" font-family="sans-serif" font-size="25" fill="#17191d" stroke="none" transform="rotate(-90 57 165)">CAN</text>
    </g>
    <!-- spill -->
    <g id="spill" transform="translate(780 175)" fill="none" stroke="#17191d">
      <path d="M20 20 C55 55 85 80 120 115 C150 145 180 165 215 180" stroke-width="20"/>
      <path d="M125 115 C115 180 110 230 105 285" stroke-width="13"/>
      <path d="M175 155 C170 215 165 260 160 300" stroke-width="10"/>
      <circle cx="105" cy="310" r="9" fill="#17191d"/>
      <circle cx="160" cy="325" r="7" fill="#17191d"/>
    </g>
  </g>
  <text x="100" y="570" font-family="sans-serif" font-size="30" fill="#17191d">ORIGINAL UNBRANDED PROP KIT • THROW / IMPACT / SPILL</text>
</svg>
