<g><rect x="70" y="145" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 195) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(280 320)"/><use href="#teen2" transform="translate(340 320)"/><use href="#teen3" transform="translate(400 320)"/><rect x="85" y="160" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="183" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S01 • F000–083 • HANG OUT</text><text x="490" y="245" fill="#d2d7dd" font-family="sans-serif" font-size="16">Teen trio establishes personalities; beer handoff; relaxed alley.</text></g><g><rect x="930" y="145" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 195) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(1140 320)"/><use href="#teen2" transform="translate(1200 320)"/><use href="#teen3" transform="translate(1260 320)"/><rect x="945" y="160" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="183" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S02 • F084–143 • POLICE ARRIVE</text><text x="1350" y="245" fill="#d2d7dd" font-family="sans-serif" font-size="16">Siren → light sweep → Teen 03 notices → group stare.</text></g><g><rect x="70" y="395" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 445) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(280 570)"/><use href="#teen2" transform="translate(340 570)"/><use href="#teen3" transform="translate(400 570)"/><rect x="85" y="410" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="433" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S03 • F144–215 • “SHIT! THEY’RE COMING!”</text><text x="490" y="495" fill="#d2d7dd" font-family="sans-serif" font-size="16">Freeze → grab beer → look for exit → staggered launch.</text></g><g><rect x="930" y="395" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 445) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(1140 570)"/><use href="#teen2" transform="translate(1200 570)"/><use href="#teen3" transform="translate(1260 570)"/><rect x="945" y="410" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="433" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S04 • F216–299 • RUN / DUCK / HIDE</text><text x="1350" y="495" fill="#d2d7dd" font-family="sans-serif" font-size="16">Physical run down alley → duck behind cover → peek back.</text></g><g><rect x="70" y="645" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 695) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(280 820)"/><use href="#teen2" transform="translate(340 820)"/><use href="#teen3" transform="translate(400 820)"/><rect x="85" y="660" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="683" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S05 • F300–371 • WE STILL HAVE THE BEER</text><text x="490" y="745" fill="#d2d7dd" font-family="sans-serif" font-size="16">Breathing → can rattle → realization → look toward bush.</text></g><g><rect x="930" y="645" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 695) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(1140 820)"/><use href="#teen2" transform="translate(1200 820)"/><use href="#teen3" transform="translate(1260 820)"/><rect x="945" y="660" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="683" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S06 • F372–419 • WHAT DO WE DO WITH THE BEER?</text><text x="1350" y="745" fill="#d2d7dd" font-family="sans-serif" font-size="16">Question → silence → eye-line chain toward bush.</text></g><g><rect x="70" y="895" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 945) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(280 1070)"/><use href="#teen2" transform="translate(340 1070)"/><use href="#teen3" transform="translate(400 1070)"/><rect x="85" y="910" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="933" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S07 • F420–455 • “IN THE BUSHES!”</text><text x="490" y="995" fill="#d2d7dd" font-family="sans-serif" font-size="16">Point → recognition → phrase → commitment to move.</text></g><g><rect x="930" y="895" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 945) scale(.42)"><use href="#bg"/></g><use href="#teen" transform="translate(1140 1070)"/><use href="#teen2" transform="translate(1200 1070)"/><use href="#teen3" transform="translate(1260 1070)"/><rect x="945" y="910" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="933" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S08 • F456–539 • RUN OUT / THROW</text><text x="1350" y="995" fill="#d2d7dd" font-family="sans-serif" font-size="16">They physically exit alley → wind-up → throw → cans separate → impact.</text></g><g><rect x="70" y="1145" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 1195) scale(.42)"><use href="#bg"/></g><use href="#busch" transform="translate(490 1300) scale(.75)"/><rect x="85" y="1160" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="1183" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S09 • F540–647 • TRANSFORMATION</text><text x="490" y="1245" fill="#d2d7dd" font-family="sans-serif" font-size="16">Drip → twitch → shudder → compress/rebound → energy pulse.</text></g><g><rect x="930" y="1145" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 1195) scale(.42)"><use href="#bg"/></g><use href="#busch" transform="translate(1350 1300) scale(1.25)"/><rect x="945" y="1160" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="1183" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S10 • F648–719 • BUSCH WAKES</text><text x="1350" y="1245" fill="#d2d7dd" font-family="sans-serif" font-size="16">Rise → eyes focus → discovers branch arm → steadies.</text></g><g><rect x="70" y="1395" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 1445) scale(.42)"><use href="#bg"/></g><use href="#busch" transform="translate(490 1550) scale(1.25)"/><rect x="85" y="1410" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="1433" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S11 • F720–791 • BUSCH PROCESSES</text><text x="490" y="1495" fill="#d2d7dd" font-family="sans-serif" font-size="16">Notices teens → tracks them → looks at cans → inspects self.</text></g><g><rect x="930" y="1395" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(945 1445) scale(.42)"><use href="#bg"/></g><use href="#busch" transform="translate(1350 1550) scale(1.25)"/><rect x="945" y="1410" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="960" y="1433" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S12 • F792–839 • LOOK-AWAY</text><text x="1350" y="1495" fill="#d2d7dd" font-family="sans-serif" font-size="16">Confused turn → deliberate look-away → tiny sway → hold.</text></g><g><rect x="70" y="1645" width="800" height="225" rx="12" fill="#171c23" stroke="#59616b" stroke-width="2"/><g transform="translate(85 1695) scale(.42)"><use href="#bg"/></g><use href="#busch" transform="translate(490 1800) scale(1.25)"/><rect x="85" y="1660" width="770" height="32" rx="8" fill="#0c0f14" opacity=".9"/><text x="100" y="1683" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">S13 • F840–887 • REACTION → TITLE</text><text x="490" y="1745" fill="#d2d7dd" font-family="sans-serif" font-size="16">Blink/sway → awkward hold → hard cut to title.</text></g>
<text x="70" y="1725" fill="#d8a35f" font-family="sans-serif" font-size="20">This is the visual storyboard we can now use as the production map. The next pass can replace each blocking panel with exact rendered frame compositions from the active character rig.</text>
