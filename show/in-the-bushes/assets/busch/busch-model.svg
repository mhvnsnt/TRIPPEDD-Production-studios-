<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Busch original character model sheet</title>
  <desc>Original stylized sentient bush character for In the Bushes. No beer branding.</desc>
  <rect width="1600" height="900" fill="#11151a"/>
  <text x="80" y="90" fill="#f2f2f2" font-family="sans-serif" font-size="44" font-weight="700">BUSCH — MODEL / OPENING STATES</text>
  <text x="80" y="135" fill="#aab0b7" font-family="sans-serif" font-size="22">Original show asset • exaggerated silhouette • reusable cutout components</text>
  <g transform="translate(170 230)">
    <ellipse cx="250" cy="270" rx="230" ry="190" fill="#30432f" stroke="#0b0e0c" stroke-width="18"/>
    <circle cx="125" cy="190" r="105" fill="#40583d"/><circle cx="270" cy="150" r="125" fill="#3a5138"/><circle cx="380" cy="220" r="100" fill="#40583d"/><circle cx="210" cy="315" r="120" fill="#344a32"/><circle cx="350" cy="325" r="115" fill="#2f432d"/>
    <path d="M95 390 Q125 455 150 480 M395 390 Q365 455 340 480" fill="none" stroke="#1b291b" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="180" cy="250" rx="23" ry="34" fill="#e8eee5"/><ellipse cx="330" cy="250" rx="23" ry="34" fill="#e8eee5"/>
    <circle cx="185" cy="262" r="9" fill="#111"/><circle cx="335" cy="262" r="9" fill="#111"/>
    <path d="M205 325 Q255 350 305 325" fill="none" stroke="#111" stroke-width="13" stroke-linecap="round"/>
    <text x="145" y="560" fill="#f2f2f2" font-family="sans-serif" font-size="28">IDLE / BASE</text>
  </g>
  <g transform="translate(800 180)">
    <text x="0" y="0" fill="#f2f2f2" font-family="sans-serif" font-size="30">REUSABLE COMPONENTS</text>
    <g transform="translate(0 55)"><rect width="260" height="100" rx="20" fill="#263326" stroke="#647260" stroke-width="4"/><text x="25" y="62" fill="#f2f2f2" font-family="sans-serif" font-size="25">foliage body</text></g>
    <g transform="translate(300 55)"><rect width="260" height="100" rx="20" fill="#263326" stroke="#647260" stroke-width="4"/><text x="25" y="62" fill="#f2f2f2" font-family="sans-serif" font-size="25">face / eyes</text></g>
    <g transform="translate(0 185)"><rect width="260" height="100" rx="20" fill="#263326" stroke="#647260" stroke-width="4"/><text x="25" y="62" fill="#f2f2f2" font-family="sans-serif" font-size="25">branch arms</text></g>
    <g transform="translate(300 185)"><rect width="260" height="100" rx="20" fill="#263326" stroke="#647260" stroke-width="4"/><text x="25" y="62" fill="#f2f2f2" font-family="sans-serif" font-size="25">mouth swaps</text></g>
    <text x="0" y="350" fill="#aab0b7" font-family="sans-serif" font-size="22">States: wake • transform • confused • drunk • look-away • reaction</text>
    <text x="0" y="390" fill="#aab0b7" font-family="sans-serif" font-size="22">Design rule: silhouette carries the joke before detail does.</text>
  </g>
</svg>
