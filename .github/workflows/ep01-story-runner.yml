name: EP01 Story Runner Cut

on:
  workflow_dispatch:
  push:
    paths:
      - production/EP01/RUN-PUBLIC-BUILD

concurrency:
  group: ep01-story-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
  TRIPPEDD_PROGRESS_STALL_SECONDS: '180'
  TRIPPEDD_PROGRESS_TELEMETRY_GRACE_SECONDS: '60'
  TRIPPEDD_TELEMETRY_PUBLISH_INTERVAL_SECONDS: '5'
  TRIPPEDD_TELEMETRY_ISSUE_NUMBER: '16'
  TRIPPEDD_EXPECTED_SOURCE_FILES: '19'
  EP01_SALVAGE_RUN_ID: '34428807358'

jobs:
  preflight-source:
    name: EP01 source transport preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache EP01 source media
        uses: actions/cache@v4
        with:
          path: .trippedd/media
          key: trippedd-ep01-source-media-v1-${{ runner.os }}
      - name: Install preflight tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.2.0'
          rclone version
      - name: Configure optional Drive credentials
        env:
          TRIPPEDD_RCLONE_CONFIG_B64: ${{ secrets.TRIPPEDD_RCLONE_CONFIG_B64 }}
          TRIPPEDD_DRIVE_COOKIES_B64: ${{ secrets.TRIPPEDD_DRIVE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${TRIPPEDD_RCLONE_CONFIG_B64:-}" ]; then
            mkdir -p "$HOME/.config/rclone"
            printf '%s' "$TRIPPEDD_RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
            chmod 600 "$HOME/.config/rclone/rclone.conf"
            echo 'Authenticated rclone config installed (credentials redacted).'
          else
            echo 'No rclone credential secret configured.'
          fi
          if [ -n "${TRIPPEDD_DRIVE_COOKIES_B64:-}" ]; then
            printf '%s' "$TRIPPEDD_DRIVE_COOKIES_B64" | base64 --decode > /tmp/trippedd-cookies.txt
            chmod 600 /tmp/trippedd-cookies.txt
            echo 'Drive browser cookies configured for public-source recovery.'
          else
            echo 'No Drive cookie secret configured.'
          fi
      - name: Probe real source transport
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_EXPECTED_SOURCE_FILES: ${{ env.TRIPPEDD_EXPECTED_SOURCE_FILES }}
          TRIPPEDD_RCLONE_REMOTE: ${{ vars.TRIPPEDD_RCLONE_REMOTE }}
          TRIPPEDD_RCLONE_PATH: ${{ vars.TRIPPEDD_RCLONE_PATH }}
          TRIPPEDD_DRIVE_COOKIES_FILE: /tmp/trippedd-cookies.txt
        run: |
          set -euo pipefail
          if [ ! -s "$TRIPPEDD_DRIVE_COOKIES_FILE" ]; then unset TRIPPEDD_DRIVE_COOKIES_FILE; fi
          bash scripts/production/ep01-preflight.sh

  render-subjectivity:
    needs: preflight-source
    name: Render/salvage subjectivity chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { chunk: '01', start: 1, end: 12 }
          - { chunk: '02', start: 13, end: 24 }
          - { chunk: '03', start: 25, end: 36 }
          - { chunk: '04', start: 37, end: 48 }
          - { chunk: '05', start: 49, end: 60 }
          - { chunk: '06', start: 61, end: 72 }
          - { chunk: '07', start: 73, end: 84 }
          - { chunk: '08', start: 85, end: 96 }
          - { chunk: '09', start: 97, end: 108 }
          - { chunk: '10', start: 109, end: 120 }
          - { chunk: '11', start: 121, end: 132 }
          - { chunk: '12', start: 133, end: 144 }
    steps:
      - uses: actions/checkout@v4
      - name: Salvage completed chunk from prior run
        id: salvage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: EP01-STORY-SUBJECTIVITY-CHUNK-${{ matrix.chunk }}
          path: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}
          run-id: ${{ env.EP01_SALVAGE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate salvage and decide whether to render
        id: salvage-check
        env:
          FRAME_DIR: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}
        run: |
          set -euo pipefail
          expected=12
          actual=$(find "$FRAME_DIR" -maxdepth 1 -type f -name 'frame-*.jpg' -size +0c | wc -l)
          if [ "$actual" -eq "$expected" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "SUBJECTIVITY_SALVAGE=COMPLETE chunk=${{ matrix.chunk }} frames=$actual/$expected"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "SUBJECTIVITY_SALVAGE=MISS chunk=${{ matrix.chunk }} frames=$actual/$expected"
            rm -rf "$FRAME_DIR"
            mkdir -p "$FRAME_DIR"
          fi
      - name: Cache Blender archive
        if: steps.salvage-check.outputs.usable != 'true'
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trippedd/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-${{ runner.os }}
      - name: Cache completed subjectivity frames
        if: steps.salvage-check.outputs.usable != 'true'
        uses: actions/cache@v4
        with:
          path: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}/
          key: subjectivity-${{ hashFiles('production/EP01/generated/blender/build_subjectivity.py') }}-${{ matrix.chunk }}
      - name: Install render tools
        if: steps.salvage-check.outputs.usable != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0
      - name: Install Blender
        if: steps.salvage-check.outputs.usable != 'true'
        env:
          BLENDER_CACHE_HIT: ${{ steps.blender-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd
          if [ "$BLENDER_CACHE_HIT" != 'true' ]; then curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"; fi
          test -s "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#$HOME/.cache/trippedd/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
      - name: Render missing subjectivity frames
        if: steps.salvage-check.outputs.usable != 'true'
        env:
          TRIPPEDD_FRAME_START: ${{ matrix.start }}
          TRIPPEDD_FRAME_END: ${{ matrix.end }}
          TRIPPEDD_FRAME_DIR: ${{ github.workspace }}/production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}
        run: |
          set -euo pipefail
          blender -b --python production/EP01/generated/blender/build_subjectivity.py
      - name: Verify chunk
        env:
          FRAME_DIR: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}
        run: |
          set -euo pipefail
          expected=12
          actual=$(find "$FRAME_DIR" -maxdepth 1 -type f -name 'frame-*.jpg' -size +0c | wc -l)
          test "$actual" -eq "$expected"
          echo "SUBJECTIVITY_CHUNK_PROGRESS=100% chunk=${{ matrix.chunk }} frames=$actual/$expected"
      - name: Upload chunk for current run
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-SUBJECTIVITY-CHUNK-${{ matrix.chunk }}
          path: production/EP01/generated/blender/subjectivity/chunk-${{ matrix.chunk }}/
          if-no-files-found: error
          retention-days: 30

  build-ep01-story-runner:
    needs: [preflight-source, render-subjectivity]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Record production build identity
        run: |
          set -euo pipefail
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "salvage_run=${EP01_SALVAGE_RUN_ID}"
          } | tee public-production-build-identity.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Python media packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-media-${{ runner.os }}-py311-v1
      - name: Cache EP01 source media
        uses: actions/cache@v4
        with:
          path: .trippedd/media
          key: trippedd-ep01-source-media-v1-${{ runner.os }}
      - name: Cache assembly segments
        uses: actions/cache@v4
        with:
          path: .trippedd/media/assembly-segments
          key: story-assembly-${{ hashFiles('src/server/pilotRenderer.ts') }}-${{ runner.os }}
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .trippedd/huggingface
          key: trippedd-whisper-tiny-${{ runner.os }}
      - name: Cache Blender archive
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trippedd/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-${{ runner.os }}
      - name: Install media stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo tesseract-ocr curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0 rclone
          rclone version
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.2.0' 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'faster-whisper>=1.2.0' 'opentimelineio>=0.18.1'
      - name: Configure optional authenticated rclone Drive remote
        env:
          TRIPPEDD_RCLONE_CONFIG_B64: ${{ secrets.TRIPPEDD_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${TRIPPEDD_RCLONE_CONFIG_B64:-}" ]; then
            mkdir -p "$HOME/.config/rclone"
            printf '%s' "$TRIPPEDD_RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
            chmod 600 "$HOME/.config/rclone/rclone.conf"
            echo 'Authenticated rclone config installed (credentials redacted).'
            rclone listremotes | sed 's/:$/: [configured]/'
          else
            echo 'No TRIPPEDD_RCLONE_CONFIG_B64 secret configured; rclone recovery remains disabled and gdown/cookies remain fallback.'
          fi
      - name: Install Blender
        env:
          BLENDER_CACHE_HIT: ${{ steps.blender-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd
          if [ "$BLENDER_CACHE_HIT" != 'true' ]; then curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"; fi
          test -s "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#/home/runner/.cache/trippedd/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
      - name: Download current-run subjectivity chunks
        uses: actions/download-artifact@v4
        with:
          pattern: EP01-STORY-SUBJECTIVITY-CHUNK-*
          path: production/EP01/generated/blender/subjectivity
          merge-multiple: false
      - name: Assemble subjectivity
        run: |
          set -euo pipefail
          mkdir -p production/EP01/generated/blender/subjectivity/assembled
          for n in $(seq 1 144); do
            printf -v frame '%04d' "$n"
            chunk=$(( (n - 1) / 12 + 1 )); printf -v chunk '%02d' "$chunk"
            src="production/EP01/generated/blender/subjectivity/EP01-STORY-SUBJECTIVITY-CHUNK-${chunk}/frame-${frame}.jpg"
            test -s "$src"
            cp "$src" "production/EP01/generated/blender/subjectivity/assembled/frame-${frame}.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error -framerate 24 -i production/EP01/generated/blender/subjectivity/assembled/frame-%04d.jpg -vf "scale=1920:1080:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -movflags +faststart production/EP01/generated/blender/ep01_subjectivity.mp4
          test -s production/EP01/generated/blender/ep01_subjectivity.mp4
      - name: Build Bastard terminal tag (resumable)
        uses: ./.github/actions/resumable-bastard-tag
      - name: Install Node dependencies
        run: bun install --no-save
      - name: Build Story Runner cut
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIPPEDD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_SEGMENT_CACHE: ${{ github.workspace }}/.trippedd/media/assembly-segments
          HF_HOME: ${{ github.workspace }}/.trippedd/huggingface
          TRIPPEDD_ENABLE_WHISPER: 'true'
          WHISPER_MODEL: 'tiny'
          TRIPPEDD_WHISPER_DEVICE: 'cpu'
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_CUT_MODE: SHOWRUNNER
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
          MEDIA_MAX_CONCURRENT: '2'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
          EP01_RENDER_CONCURRENCY: '4'
          TRIPPEDD_RCLONE_REMOTE: ${{ vars.TRIPPEDD_RCLONE_REMOTE }}
          TRIPPEDD_RCLONE_PATH: ${{ vars.TRIPPEDD_RCLONE_PATH }}
        run: bash scripts/production/watch-progress.sh --progress-file "public/production/.progress/EP01-${{ github.run_id }}-${{ github.run_attempt }}.json" -- bun run pilot:build:public
      - name: Verify Story Runner
        run: |
          set -euo pipefail
          test -s public/production/EP01-STORY-RUNNER.mp4
          test -s public/production/EP01-STORY-RUNNER.json
          test -s public/production/EP01-STORY-RUNNER.otio
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate -of json public/production/EP01-STORY-RUNNER.mp4 > public/production/EP01-STORY-RUNNER.ffprobe.json
          mediainfo public/production/EP01-STORY-RUNNER.mp4 > public/production/EP01-STORY-RUNNER.mediainfo.txt
      - name: Validate production artifact
        env:
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
        run: bun run pilot:validate
      - name: Upload Story Runner
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-RUNNER
          path: |
            public/production/EP01-STORY-RUNNER.mp4
            public/production/EP01-STORY-RUNNER.json
            public/production/EP01-STORY-RUNNER.otio
            public/production/EP01-STORY-RUNNER.ffprobe.json
            public/production/EP01-STORY-RUNNER.mediainfo.txt
            public/production/production-artifact-qc.json
            public/production/.progress/
            production/EP01/generated/blender/ep01_subjectivity.mp4
            production/EP01/generated/blender/ep01_bastard_tag.mp4
            public-production-build-identity.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-RUNNER-FAILURE-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-production-build-identity.txt
            public/production/.progress/
            public/production/EP01-STORY-RUNNER.json
            public/production/EP01-STORY-RUNNER.otio
            public/production/production-artifact-qc.json
          if-no-files-found: warn
          retention-days: 14
