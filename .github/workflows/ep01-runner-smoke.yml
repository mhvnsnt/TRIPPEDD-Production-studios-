name: EP01 Runner Smoke

on:
  push:
    paths:
      - .github/workflows/ep01-runner-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner smoke (ubuntu-slim)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify runner allocation
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "cpu=$(nproc)"
          echo "TRIPPEDD_RUNNER_SMOKE_OK"
