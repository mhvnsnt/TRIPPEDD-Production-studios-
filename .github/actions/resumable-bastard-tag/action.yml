name: Resumable Bastard terminal tag
description: Render the Bastard terminal tag in independently durable frame chunks, reusing restored checkpoints and bounded parallelism.
runs:
  using: composite
  steps:
    - name: Prepare Bastard frame workspace
      shell: bash
      run: mkdir -p production/EP01/generated/blender/bastard_tag_frames

    - name: Restore Bastard frames chunk 01
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-01/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-01-v4
    - name: Restore Bastard frames chunk 02
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-02/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-02-v4
    - name: Restore Bastard frames chunk 03
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-03/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-03-v4
    - name: Restore Bastard frames chunk 04
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-04/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-04-v4
    - name: Restore Bastard frames chunk 05
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-05/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-05-v4
    - name: Restore Bastard frames chunk 06
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-06/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-06-v4
    - name: Restore Bastard frames chunk 07
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-07/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-07-v4
    - name: Restore Bastard frames chunk 08
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-08/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-08-v4
    - name: Restore Bastard frames chunk 09
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-09/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-09-v4
    - name: Restore Bastard frames chunk 10
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-10/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-10-v4
    - name: Restore Bastard frames chunk 11
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-11/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-11-v4
    - name: Restore Bastard frames chunk 12
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-12/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-12-v4

    - name: Render missing Bastard chunks in bounded parallel batches
      shell: bash
      env:
        TRIPPEDD_BASTARD_PARALLELISM: '3'
      run: |
        set -euo pipefail
        root="$GITHUB_WORKSPACE/production/EP01/generated/blender/bastard_tag_frames"
        script="production/EP01/generated/blender/build_bastard_tag.py"
        parallelism="${TRIPPEDD_BASTARD_PARALLELISM:-3}"
        case "$parallelism" in 1|2|3|4) ;; *) echo "Invalid TRIPPEDD_BASTARD_PARALLELISM=$parallelism; using 3"; parallelism=3 ;; esac

        valid_chunk() {
          local dir="$1"
          test "$(find "$dir" -maxdepth 1 -type f -name 'frame-*.png' -size +0c | wc -l)" -eq 12
        }

        render_chunk() {
          local n="$1"
          local start=$(( (n - 1) * 12 + 1 ))
          local end=$(( n * 12 ))
          local dir="$root/chunk-$(printf '%02d' "$n")"
          mkdir -p "$dir"
          if valid_chunk "$dir"; then
            echo "BASTARD_CHUNK_CACHE_HIT chunk=$(printf '%02d' "$n") frames=12 bytes=$(du -sb "$dir" | cut -f1)"
            return 0
          fi
          echo "BASTARD_CHUNK_START chunk=$(printf '%02d' "$n") frames=${start}-${end}"
          TRIPPEDD_FRAME_START="$start" \
          TRIPPEDD_FRAME_END="$end" \
          TRIPPEDD_FRAME_DIR="$dir" \
          blender -b --python "$script"
          test "$(find "$dir" -maxdepth 1 -type f -name 'frame-*.png' -size +0c | wc -l)" -eq 12
          echo "BASTARD_CHUNK_COMPLETE chunk=$(printf '%02d' "$n") frames=12 bytes=$(du -sb "$dir" | cut -f1)"
        }

        for batch_start in 1 4 7 10; do
          pids=()
          for n in $(seq "$batch_start" $((batch_start + parallelism - 1))); do
            test "$n" -le 12 || continue
            render_chunk "$n" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
        done

    - name: Save Bastard frames chunk 01
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-01/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-01-v4
    - name: Save Bastard frames chunk 02
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-02/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-02-v4
    - name: Save Bastard frames chunk 03
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-03/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-03-v4
    - name: Save Bastard frames chunk 04
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-04/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-04-v4
    - name: Save Bastard frames chunk 05
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-05/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-05-v4
    - name: Save Bastard frames chunk 06
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-06/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-06-v4
    - name: Save Bastard frames chunk 07
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-07/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-07-v4
    - name: Save Bastard frames chunk 08
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-08/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-08-v4
    - name: Save Bastard frames chunk 09
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-09/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-09-v4
    - name: Save Bastard frames chunk 10
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-10/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-10-v4
    - name: Save Bastard frames chunk 11
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-11/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-11-v4
    - name: Save Bastard frames chunk 12
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames/chunk-12/
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-12-v4

    - name: Assemble Bastard terminal tag
      shell: bash
      run: |
        set -euo pipefail
        root="$GITHUB_WORKSPACE/production/EP01/generated/blender/bastard_tag_frames"
        mkdir -p production/EP01/generated/blender/bastard_tag_frames/all
        rm -f production/EP01/generated/blender/bastard_tag_frames/all/frame-*.png
        for n in $(seq -w 1 12); do
          find "$root/chunk-$n" -maxdepth 1 -type f -name 'frame-*.png' -size +0c -print0 | xargs -0 -r -I{} cp "{}" production/EP01/generated/blender/bastard_tag_frames/all/
        done
        test "$(find production/EP01/generated/blender/bastard_tag_frames/all -maxdepth 1 -type f -name 'frame-*.png' -size +0c | wc -l)" -eq 144
        ffmpeg -y -hide_banner -loglevel error -framerate 24 -i production/EP01/generated/blender/bastard_tag_frames/all/frame-%04d.png -vf "scale=1920:1080:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -movflags +faststart production/EP01/generated/blender/ep01_bastard_tag.mp4
        test -s production/EP01/generated/blender/ep01_bastard_tag.mp4
        echo "BASTARD_TAG_BYTES=$(stat -c '%s' production/EP01/generated/blender/ep01_bastard_tag.mp4)"
