<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goodville segment — mobile layer/timeline editor</title>
<style>body{font:15px system-ui;margin:0;background:#111;color:#eee}#stage{position:relative;width:100vw;aspect-ratio:16/9;background:#87ceeb;overflow:hidden}
#stage img{position:absolute;touch-action:none}.sel{outline:2px solid #ff0}#ui{padding:8px}input[type=range]{width:100%}button,select{font-size:16px;padding:6px}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}.trk{font-size:12px;opacity:.8}</style></head><body>
<div id="stage"></div><div id="ui">
<div class="row">Frame <input id="f" type="range" min="0" max="359" value="252"><span id="fl"></span></div>
<div class="row"><button id="play">▶︎ Play</button><select id="layer"></select></div>
<div class="row">Scale <input id="sc" type="range" min="0.2" max="4" step="0.01"></div>
<div class="row">Start<input id="fs" type="number" style="width:70px"> End<input id="fe" type="number" style="width:70px"></div>
<div class="row"><button id="save">⬇︎ Save timeline.json</button></div>
<div class="trk" id="tracks"></div><audio id="au"></audio>
<p class="trk">Drag a layer with your finger to move it on this frame range. Save, then commit timeline.json (GitHub mobile app → upload) and run render.py. Pieces are never regenerated.</p></div>
<script>
let T,cur=null,K=1;const st=document.getElementById('stage'),F=document.getElementById('f');
const inr=(fr,f)=>(Array.isArray(fr[0])?fr:[fr]).some(([a,b])=>a<=f&&f<=b);
fetch('timeline.json').then(r=>r.json()).then(j=>{T=j;const s=document.getElementById('layer');
T.tracks.video.filter(v=>v.src).forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.id+(v.type?' ['+v.type+']':'');s.append(o)});
s.onchange=()=>{cur=T.tracks.video.find(v=>v.id==s.value);sync()};s.onchange();
document.getElementById('au').src=T.tracks.audio[0].src;draw();
document.getElementById('tracks').innerHTML=T.tracks.audio.map(a=>`🔊 ${a.id} @ ${a.start_s}s ${a.src||a.synth}`).join('<br>')});
function sync(){sc.value=cur.scale||1;const fr=Array.isArray(cur.frames[0])?cur.frames[0]:cur.frames;fs.value=fr[0];fe.value=fr[1]}
function draw(){K=st.clientWidth/T.width;st.innerHTML='';const f=+F.value;fl.textContent=f+' ('+(f/24).toFixed(2)+'s)';
for(const v of T.tracks.video){if(!v.src||!inr(v.frames,f))continue;const im=new Image();im.src=v.src;im.onload=()=>{const s=(v.scale||1)*K;
im.style.width=(v.stretch?v.stretch[0]:v.fit?T.width:im.naturalWidth)*(v.stretch||v.fit?K:s)+'px';im.style.left=(v.x||0)*K+'px';im.style.top=(v.y||0)*K+'px';
if(v.flip)im.style.transform='scaleX(-1)';};if(cur&&v.id==cur.id)im.className='sel';
im.onpointerdown=e=>{cur=v;layer.value=v.id;sync();const sx=e.clientX,sy=e.clientY,ox=v.x||0,oy=v.y||0;im.setPointerCapture(e.pointerId);
im.onpointermove=m=>{v.x=Math.round(ox+(m.clientX-sx)/K);v.y=Math.round(oy+(m.clientY-sy)/K);im.style.left=v.x*K+'px';im.style.top=v.y*K+'px'};im.onpointerup=()=>im.onpointermove=null};st.append(im)}}
F.oninput=draw;sc.oninput=()=>{cur.scale=+sc.value;draw()};
fs.onchange=fe.onchange=()=>{cur.frames=[+fs.value,+fe.value];draw()};
let timer=null;play.onclick=()=>{const a=document.getElementById('au');if(timer){clearInterval(timer);timer=null;a.pause();return}
F.value=0;a.currentTime=0;setTimeout(()=>a.play(),300);timer=setInterval(()=>{F.value=(+F.value+1)%360;draw()},1000/24)};
save.onclick=()=>{const b=new Blob([JSON.stringify(T,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='timeline.json';a.click()};
</script></body></html>
