name: EP01 Story Runner Cut

# REAL EPISODE HARD GATE:
# This workflow is intentionally NOT push-triggered. It can only be launched
# manually or by the post-gate promotion workflow after the short E2E proof has
# completed successfully. Editing RUN-PUBLIC-BUILD therefore cannot burn a
# long render window before the pipeline has proved itself.
on:
  workflow_dispatch:

concurrency:
  group: ep01-story-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

