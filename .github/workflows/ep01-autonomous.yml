name: EP01 Autonomous Cut

on:
  workflow_dispatch:
  push:
    paths:
      - production/EP01/RUN-PUBLIC-BUILD
      - .github/workflows/ep01-autonomous.yml
      - scripts/run-public-pilot.ts
      - scripts/bin/whisper
      - production/EP01/generated/blender/**
      - src/server/publicDriveFolder.ts
      - src/server/queueManager.ts
      - src/server/mediaPipeline.ts
      - src/server/pilotRenderer.ts
      - src/server/productionMemory.ts

concurrency:
  group: ep01-autonomous-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ep01-autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr blender

      - name: Install full open-source media stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.1.0' 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'openai-whisper>=20240930' 'faster-whisper>=1.2.0' 'opentimelineio>=0.17.0'
          python -m scenedetect --version
          python -m gdown --version
          python -c "import cv2; print('OpenCV', cv2.__version__)"
          python -c "import whisper; print('Whisper import OK')"
          python -c "import faster_whisper; print('faster-whisper import OK')"
          python -c "import opentimelineio as otio; print('OpenTimelineIO', otio.__version__)"
          blender --version | head -n 2

      - name: Activate production transcription wrapper
        run: |
          chmod +x scripts/bin/whisper
          echo "${{ github.workspace }}/scripts/bin" >> "$GITHUB_PATH"
          whisper --help

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Build generated EP01 subjectivity sequence
        run: |
          blender -b --python production/EP01/generated/blender/build_subjectivity.py
          test -s production/EP01/generated/blender/ep01_subjectivity.mp4
          test -s production/EP01/generated/blender/ep01_subjectivity.blend
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json production/EP01/generated/blender/ep01_subjectivity.mp4

      - name: Build generated Bastard terminal tag
        run: |
          blender -b --python production/EP01/generated/blender/build_bastard_tag.py
          test -s production/EP01/generated/blender/ep01_bastard_tag.mp4
          test -s production/EP01/generated/blender/ep01_bastard_tag.blend
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json production/EP01/generated/blender/ep01_bastard_tag.mp4

      - name: Build EP01 autonomous cut
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_ENABLE_WHISPER: 'true'
          WHISPER_MODEL: 'tiny'
          TRIPPEDD_WHISPER_DEVICE: 'cpu'
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_CUT_MODE: AUTONOMOUS
          TRIPPEDD_OUTPUT_BASENAME: EP01-AUTONOMOUS
          MEDIA_MAX_CONCURRENT: '2'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
          EP01_RENDER_CONCURRENCY: '2'
        run: timeout 150m bun run pilot:build:public

      - name: Verify autonomous cut
        run: |
          test -s public/production/EP01-AUTONOMOUS.mp4
          test -s public/production/EP01-AUTONOMOUS.json
          test -s public/production/EP01-AUTONOMOUS.otio
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json public/production/EP01-AUTONOMOUS.mp4

      - name: Upload autonomous cut
        uses: actions/upload-artifact@v4
        with:
          name: EP01-AUTONOMOUS
          path: |
            public/production/EP01-AUTONOMOUS.mp4
            public/production/EP01-AUTONOMOUS.json
            public/production/EP01-AUTONOMOUS.otio
            production/EP01/generated/blender/ep01_subjectivity.blend
            production/EP01/generated/blender/ep01_subjectivity.mp4
            production/EP01/generated/blender/ep01_bastard_tag.blend
            production/EP01/generated/blender/ep01_bastard_tag.mp4
          if-no-files-found: error
