<g transform="translate(1480 610) scale(.72)"><ellipse cx="250" cy="270" rx="230" ry="190" fill="#30432f" stroke="#0b0e0c" stroke-width="18"/><circle cx="125" cy="190" r="105" fill="#40583d"/><circle cx="270" cy="150" r="125" fill="#3a5138"/><circle cx="380" cy="220" r="100" fill="#40583d"/><ellipse cx="180" cy="250" rx="23" ry="34" fill="#e8eee5"/><ellipse cx="330" cy="250" rx="23" ry="34" fill="#e8eee5"/><circle cx="185" cy="262" r="9" fill="#111"/><circle cx="335" cy="262" r="9" fill="#111"/></g>
</svg>
