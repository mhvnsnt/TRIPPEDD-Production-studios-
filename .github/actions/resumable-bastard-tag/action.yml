        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-12-v1

    - name: Assemble Bastard terminal tag
      shell: bash
      run: |
        set -euo pipefail
        for n in $(seq 1 144); do
          printf -v frame '%04d' "$n"
          test -s "production/EP01/generated/blender/bastard_tag_frames/frame-${frame}.png"
        done
        ffmpeg -y -hide_banner -loglevel error -framerate 24 -i production/EP01/generated/blender/bastard_tag_frames/frame-%04d.png -vf "scale=1920:1080:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -movflags +faststart production/EP01/generated/blender/ep01_bastard_tag.mp4
        test -s production/EP01/generated/blender/ep01_bastard_tag.mp4
        echo "BASTARD_TAG_BYTES=$(stat -c '%s' production/EP01/generated/blender/ep01_bastard_tag.mp4)"
