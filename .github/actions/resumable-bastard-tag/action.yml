name: Resumable Bastard terminal tag
description: Render the Bastard terminal tag in durable frame chunks and assemble the final MP4.
runs:
  using: composite
  steps:
    - name: Prepare Bastard frame workspace
      shell: bash
      run: mkdir -p production/EP01/generated/blender/bastard_tag_frames

    - name: Restore Bastard frames chunk 01
      uses: actions/cache/restore@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-01-v1

    - name: Render Bastard frames chunk 01
      shell: bash
      env:
        TRIPPEDD_FRAME_START: '1'
        TRIPPEDD_FRAME_END: '12'
        TRIPPEDD_FRAME_DIR: ${{ github.workspace }}/production/EP01/generated/blender/bastard_tag_frames
      run: blender -b --python production/EP01/generated/blender/build_bastard_tag.py
    - name: Save Bastard frames chunk 01
      uses: actions/cache/save@v4
      with:
        path: production/EP01/generated/blender/bastard_tag_frames
        key: bastard-tag-frames-${{ hashFiles('production/EP01/generated/blender/build_bastard_tag.py') }}-${{ runner.os }}-chunk-01-v1

