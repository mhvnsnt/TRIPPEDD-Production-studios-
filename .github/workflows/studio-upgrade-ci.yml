name: Production Studio Upgrade CI

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/production-pipeline-speed-2026-09-08
      - dev/production-hardening-2026-09-08
    paths:
      - src/**
      - scripts/**
      - config/**
      - package.json
      - bun.lock
      - bun.lockb
      - .github/workflows/studio-upgrade-ci.yml

concurrency:
  group: studio-upgrade-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: package.json
      - name: Install baseline open-source analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'faster-whisper>=1.2.0' 'opentimelineio>=0.18.1'
      - name: Install optional open-source media stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openimageio-tools openexr-tools imagemagick sox rubberband-cli curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0
          oiiotool --version
          exrheader --help >/dev/null
          magick -version
          sox --version
          rubberband --help >/dev/null
      - name: Cache Blender LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/trippedd/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-${{ runner.os }}
      - name: Install exact production Blender LTS
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd
          base="https://download.blender.org/release/Blender4.5"
          archive="$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          if [ ! -s "$archive" ]; then curl -fsSL "${base}/${BLENDER_ARCHIVE}" -o "$archive"; fi
          curl -fsSL "${base}/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#$archive#" | sha256sum -c -
          sudo tar -xJf "$archive" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Preflight generated Bastard terminal tag
        run: python scripts/production/preflight-bastard-tag.py --blender blender
      - name: Install Node dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Production integrity audit
        run: bun run studio:audit:integrity
      - name: Audit production toolchain
        run: bun run studio:audit
      - name: Validate evidence/provenance contracts
        run: |
          bun run studio:test:evidence-cache
          bun run studio:test:provenance
      - name: Generate capability matrix
        run: bun x tsx scripts/production-capability-matrix.ts
      - name: Validate production artifact checker
        run: bun x tsx scripts/validate-production-artifact.ts
        continue-on-error: true
      - name: Upload upgrade diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: production-studio-upgrade-diagnostics
          path: public/production/*.json
          if-no-files-found: error
          retention-days: 14
