        TRIPPEDD_FRAME_DIR: ${{ github.workspace }}/production/EP01/generated/blender/bastard_tag_frames/chunk-12
      run: |
        set -euo pipefail
        mkdir -p "$TRIPPEDD_FRAME_DIR"
        blender -b --python production/EP01/generated/blender/build_bastard_tag.py
