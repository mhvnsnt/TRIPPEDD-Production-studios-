name: EP01 Story Runner Cut

on:
  workflow_dispatch:

concurrency:
  group: ep01-story-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
  TRIPPEDD_PROGRESS_STALL_SECONDS: '180'
  TRIPPEDD_PROGRESS_TELEMETRY_GRACE_SECONDS: '60'
  TRIPPEDD_TELEMETRY_PUBLISH_INTERVAL_SECONDS: '5'
  TRIPPEDD_TELEMETRY_ISSUE_NUMBER: '16'
  TRIPPEDD_EXPECTED_SOURCE_FILES: '19'

jobs:
  preflight-source:
    name: EP01 source transport preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache EP01 source media
        uses: actions/cache@v4
        with:
          path: .trippedd/media
          key: trippedd-ep01-source-media-v2-${{ runner.os }}
          restore-keys: |
            trippedd-ep01-source-media-v2-
            trippedd-ep01-source-media-v1-
      - name: Install transport tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.2.0'
      - name: Configure optional Drive credentials
        env:
          TRIPPEDD_RCLONE_CONFIG_B64: ${{ secrets.TRIPPEDD_RCLONE_CONFIG_B64 }}
          TRIPPEDD_DRIVE_COOKIES_B64: ${{ secrets.TRIPPEDD_DRIVE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${TRIPPEDD_RCLONE_CONFIG_B64:-}" ]; then
            mkdir -p "$HOME/.config/rclone"
            printf '%s' "$TRIPPEDD_RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
            chmod 600 "$HOME/.config/rclone/rclone.conf"
          fi
          if [ -n "${TRIPPEDD_DRIVE_COOKIES_B64:-}" ]; then
            printf '%s' "$TRIPPEDD_DRIVE_COOKIES_B64" | base64 --decode > /tmp/trippedd-cookies.txt
            chmod 600 /tmp/trippedd-cookies.txt
          fi
      - name: Probe real source transport
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_EXPECTED_SOURCE_FILES: ${{ env.TRIPPEDD_EXPECTED_SOURCE_FILES }}
          TRIPPEDD_RCLONE_REMOTE: ${{ vars.TRIPPEDD_RCLONE_REMOTE }}
          TRIPPEDD_RCLONE_PATH: ${{ vars.TRIPPEDD_RCLONE_PATH }}
          TRIPPEDD_DRIVE_COOKIES_FILE: /tmp/trippedd-cookies.txt
        run: |
          set -euo pipefail
          if [ ! -s "$TRIPPEDD_DRIVE_COOKIES_FILE" ]; then unset TRIPPEDD_DRIVE_COOKIES_FILE; fi
          bash scripts/production/ep01-preflight.sh

  build-ep01:
    needs: preflight-source
    name: Build and validate real EP01
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache EP01 source media
        uses: actions/cache@v4
        with:
          path: .trippedd/media
          key: trippedd-ep01-source-media-v2-${{ runner.os }}
          restore-keys: |
            trippedd-ep01-source-media-v2-
            trippedd-ep01-source-media-v1-
      - name: Cache production dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/pip
          key: trippedd-production-deps-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .trippedd/huggingface
          key: trippedd-whisper-tiny-${{ runner.os }}
      - name: Install production stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo tesseract-ocr curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0 rclone
          python -m pip install --upgrade pip
          python -m pip install 'gdown>=6.2.0' 'scenedetect-headless>=0.7.1' 'opencv-python-headless>=4.10' 'faster-whisper>=1.2.0' 'opentimelineio>=0.18.1'
          bun install --no-save
      - name: Cache Blender extracted toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/trippedd/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-extracted-${{ env.BLENDER_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Activate cached Blender toolchain
        run: |
          set -euo pipefail
          test -x "$HOME/.cache/trippedd/blender-${BLENDER_VERSION}-linux-x64/blender"
          sudo ln -sfn "$HOME/.cache/trippedd/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Configure authenticated rclone when available
        env:
          TRIPPEDD_RCLONE_CONFIG_B64: ${{ secrets.TRIPPEDD_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${TRIPPEDD_RCLONE_CONFIG_B64:-}" ]; then
            mkdir -p "$HOME/.config/rclone"
            printf '%s' "$TRIPPEDD_RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
            chmod 600 "$HOME/.config/rclone/rclone.conf"
          fi
      - name: Record build identity
        run: |
          mkdir -p public/production
          printf 'sha=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > public/production/build-identity.txt
      - name: Build source-driven EP01 cut
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_ENABLE_WHISPER: 'true'
          WHISPER_MODEL: tiny
          TRIPPEDD_WHISPER_DEVICE: cpu
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_CUT_MODE: SHOWRUNNER
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
          MEDIA_MAX_CONCURRENT: '2'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
          EP01_RENDER_CONCURRENCY: '2'
          TRIPPEDD_EXPECTED_SOURCE_FILES: '19'
        run: timeout 150m bun run pilot:build:public
      - name: Validate final production artifact
        env:
          TRIPPEDD_OUTPUT_BASENAME: EP01-STORY-RUNNER
        run: |
          set -euo pipefail
          bun run pilot:validate
          test -s public/production/EP01-STORY-RUNNER.mp4
          test -s public/production/EP01-STORY-RUNNER.json
          test -s public/production/EP01-STORY-RUNNER.otio
          test -s public/production/production-artifact-qc.json
      - name: Upload EP01 production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EP01-STORY-RUNNER-${{ github.run_id }}
          path: |
            public/production/EP01-STORY-RUNNER.mp4
            public/production/EP01-STORY-RUNNER.json
            public/production/EP01-STORY-RUNNER.otio
            public/production/production-artifact-qc.json
            public/production/build-identity.txt
          if-no-files-found: error
          retention-days: 30
