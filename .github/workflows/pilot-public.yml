name: EP01 Showrunner Cut

on:
  workflow_dispatch:
  push:
    paths:
      - production/EP01/RUN-PUBLIC-BUILD
      - .github/workflows/pilot-public.yml
      - requirements.txt
      - scripts/run-public-pilot.ts
      - scripts/bin/whisper
      - production/EP01/generated/**
      - src/server/publicDriveFolder.ts
      - src/server/queueManager.ts
      - src/server/mediaPipeline.ts
      - src/server/pilotRenderer.ts
      - src/server/productionMemory.ts
      - scripts/qc-ep01.ts
      - scripts/build-bastard-tag-2d.ts

# Do not serialize this workflow at the workflow level. GitHub can leave a replacement
# run pending with zero materialized jobs behind a stale concurrency lock. The pipeline
# is already content-addressed and its expensive stages are independently cached.

permissions:
  contents: read

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  build-ep01-showrunner:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick tesseract-ocr curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0
      - name: Preflight rasterizer and media toolchain
        run: |
          set -euo pipefail
          rasterizer="$(command -v magick || command -v convert)"
          test -x "$rasterizer"
          "$rasterizer" -version | head -n 1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><rect width="16" height="16" fill="black"/></svg>\n' > /tmp/ep01-rasterizer-smoke.svg
          "$rasterizer" -background none /tmp/ep01-rasterizer-smoke.svg /tmp/ep01-rasterizer-smoke.png
          test -s /tmp/ep01-rasterizer-smoke.png
      - name: Restore Blender download cache
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install production Blender LTS
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender4.5"
          url="${base}/${BLENDER_ARCHIVE}"
          checksum_url="${base}/blender-${BLENDER_VERSION}.sha256"
          if ! test -s "/tmp/${BLENDER_ARCHIVE}"; then curl -fsSL "$url" -o "/tmp/${BLENDER_ARCHIVE}"; fi
          curl -fsSL "$checksum_url" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#/tmp/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "/tmp/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Save Blender download cache
        if: success() && steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/${{ env.BLENDER_ARCHIVE }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Install open-source media stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m scenedetect --help >/dev/null
          python -m gdown --version
          python -c "import cv2; print('OpenCV', cv2.__version__)"
          python -c "import faster_whisper; print('faster-whisper import OK')"
          python -c "import opentimelineio as otio; print('OpenTimelineIO', otio.__version__)"
          python -c "import openassetio; print('OpenAssetIO import OK')"
      - name: Activate production transcription wrapper
        run: |
          chmod +x scripts/bin/whisper
          test -x scripts/bin/whisper
          ./scripts/bin/whisper --help
      - name: Install Node dependencies
        run: bun install
      - name: Restore Whisper model cache
        id: whisper-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: ep01-whisper-tiny-${{ hashFiles('requirements.txt') }}
      - name: Warm and validate Whisper model cache
        run: |
          set -euo pipefail
          python - <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel('tiny', device='cpu', compute_type='int8')
          print('faster-whisper tiny model ready:', type(model).__name__)
          PY
      - name: Persist validated Whisper model cache
        if: success() && steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/huggingface
          key: ep01-whisper-tiny-${{ hashFiles('requirements.txt') }}
      - name: Restore subjectivity render cache
        id: subjectivity-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            production/EP01/generated/blender/subjectivity_frames
            production/EP01/generated/blender/ep01_subjectivity.blend
            production/EP01/generated/blender/ep01_subjectivity.mp4
          key: ep01-subjectivity-${{ hashFiles('production/EP01/generated/blender/build_subjectivity.py') }}-blender-${{ env.BLENDER_VERSION }}-144f
      - name: Build generated EP01 subjectivity sequence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          result = subprocess.run(['blender', '-b', '--python', 'production/EP01/generated/blender/build_subjectivity.py'])
          print(f'Blender subjectivity exit code: {result.returncode}')
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY
          frame_count=$(find production/EP01/generated/blender/subjectivity_frames -maxdepth 1 -type f -name 'frame-*.jpg' -size +0c | wc -l)
          test "$frame_count" -eq 144
          if ! test -s production/EP01/generated/blender/ep01_subjectivity.blend; then
            checkpoint=$(find production/EP01/generated/blender/subjectivity_frames -maxdepth 1 -type f -name 'subjectivity-*.blend' -size +0c | sort | tail -n 1)
            test -n "$checkpoint"
            cp "$checkpoint" production/EP01/generated/blender/ep01_subjectivity.blend
            echo "Promoted validated Blender checkpoint: $checkpoint"
          fi
          test -s production/EP01/generated/blender/ep01_subjectivity.blend
          if ! test -s production/EP01/generated/blender/ep01_subjectivity.mp4; then
            ffmpeg -y -hide_banner -loglevel error -framerate 24 -start_number 1 -i production/EP01/generated/blender/subjectivity_frames/frame-%04d.jpg -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart production/EP01/generated/blender/ep01_subjectivity.mp4
          fi
          test -s production/EP01/generated/blender/ep01_subjectivity.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json production/EP01/generated/blender/ep01_subjectivity.mp4
      - name: Persist validated subjectivity cache
        if: success() && steps.subjectivity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            production/EP01/generated/blender/subjectivity_frames
            production/EP01/generated/blender/ep01_subjectivity.blend
            production/EP01/generated/blender/ep01_subjectivity.mp4
          key: ep01-subjectivity-${{ hashFiles('production/EP01/generated/blender/build_subjectivity.py') }}-blender-${{ env.BLENDER_VERSION }}-144f
      - name: Restore 2D Bastard terminal tag cache
        id: bastard-2d-cache
        uses: actions/cache/restore@v4
        with:
          path: production/EP01/generated/comic
          key: ep01-bastard-2d-${{ hashFiles('scripts/build-bastard-tag-2d.ts') }}-144f
      - name: Build 2D comic Bastard terminal tag
        run: |
          set -euo pipefail
          bun run scripts/build-bastard-tag-2d.ts
          test -s production/EP01/generated/comic/bannon-the-bastard-terminal.svg
          test -s production/EP01/generated/comic/ep01_bastard_tag.mp4
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames -of json production/EP01/generated/comic/ep01_bastard_tag.mp4
      - name: Persist validated 2D Bastard tag cache
        if: success() && steps.bastard-2d-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: production/EP01/generated/comic
          key: ep01-bastard-2d-${{ hashFiles('scripts/build-bastard-tag-2d.ts') }}-144f
      - name: Build EP01 showrunner cut
        env:
          TRIPPEDD_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1e55zooUU98r9MXyRzcR0qgNq1EqGiqVI
          TRIPPEDD_MEDIA_CACHE: ${{ github.workspace }}/.trippedd/media
          TRIPPEDD_ENABLE_WHISPER: 'true'
          WHISPER_MODEL: 'tiny'
          TRIPPEDD_WHISPER_DEVICE: 'cpu'
          TRIPPEDD_WHISPER_COMPUTE_TYPE: int8
          TRIPPEDD_AUTO_FIRST_ASSEMBLY: 'false'
          TRIPPEDD_CUT_MODE: SHOWRUNNER
          TRIPPEDD_OUTPUT_BASENAME: EP01-SHOWRUNNER
          MEDIA_MAX_CONCURRENT: '2'
          EP01_MAX_CLIPS: '24'
          EP01_CLIP_PADDING: '1.25'
          EP01_RENDER_CONCURRENCY: '2'
        run: timeout 150m bun run pilot:build:public
      - name: Verify showrunner cut
        run: |
          set -euo pipefail
          test -s public/production/EP01-SHOWRUNNER.mp4
          test -s public/production/EP01-SHOWRUNNER.json
          test -s public/production/EP01-SHOWRUNNER.otio
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json public/production/EP01-SHOWRUNNER.mp4
          python - <<'PY'
          import opentimelineio as otio
          timeline = otio.adapters.read_from_file('public/production/EP01-SHOWRUNNER.otio')
          if not timeline.tracks:
              raise SystemExit('OTIO validation failed: timeline has no tracks')
          print('OpenTimelineIO validation OK:', timeline.name or 'EP01-SHOWRUNNER', 'tracks=', len(timeline.tracks))
          PY
      - name: Write showrunner artifact manifest
        run: |
          set -euo pipefail
          manifest="public/production/EP01-SHOWRUNNER.manifest.sha256"
          : > "$manifest"
          sha256sum public/production/EP01-SHOWRUNNER.mp4 public/production/EP01-SHOWRUNNER.json public/production/EP01-SHOWRUNNER.otio production/EP01/generated/blender/ep01_subjectivity.blend production/EP01/generated/blender/ep01_subjectivity.mp4 production/EP01/generated/comic/bannon-the-bastard-terminal.svg production/EP01/generated/comic/ep01_bastard_tag.mp4 > "$manifest"
          test "$(wc -l < "$manifest")" -eq 7
      - name: Run EP01 technical QC
        env:
          TRIPPEDD_QC_BASENAME: EP01-SHOWRUNNER
        run: bunx tsx scripts/qc-ep01.ts
      - name: Upload showrunner cut
        uses: actions/upload-artifact@v4
        with:
          name: EP01-SHOWRUNNER
          path: |
            public/production/EP01-SHOWRUNNER.mp4
            public/production/EP01-SHOWRUNNER.json
            public/production/EP01-SHOWRUNNER.otio
            public/production/EP01-SHOWRUNNER.manifest.sha256
            production/EP01/QC-PASS.json
            public/production/EP01-vmaf.json
            production/EP01/generated/blender/ep01_subjectivity.blend
            production/EP01/generated/blender/ep01_subjectivity.mp4
            production/EP01/generated/comic/bannon-the-bastard-terminal.svg
            production/EP01/generated/comic/ep01_bastard_tag.mp4
          if-no-files-found: error
