name: Production Short E2E Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/network-ident/**'
      - 'production/conversations/**'
      - 'config/production/**'
      - '.github/workflows/production-short-e2e-gate.yml'
      - 'scripts/production/**'
      - 'scripts/production/build-network-commercial.py'
      - 'scripts/run-public-pilot.ts'
      - 'scripts/validate-production-artifact.ts'
      - 'src/core/pipeline/**'
      - 'src/core/editorial/**'
      - 'github_app/**'
      - 'supervisor/**'
      - 'requirements-autonomous-bridge.txt'
      - 'install/**'

concurrency:
  group: production-short-e2e-gate
  cancel-in-progress: true

permissions:
  contents: read

# HARD GATE: one continuous authored commercial must traverse the same OSS
# ingest -> analysis -> editorial -> render -> QC -> delivery path used by EP01.
# Expected wall time: ~8 minutes. Hard job ceiling: 20 minutes.

jobs:
  short-e2e:
    name: 20-second TRIPPEDD network commercial proof
    runs-on: ${{ vars.TRIPPEDD_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Publish production ETA and watchdog policy
        run: |
          set -euo pipefail
          {
            echo "## Production Run ETA"
            echo "- Expected completion: **~8 minutes**"
            echo "- Hard ceiling: **20 minutes**"
            echo "- Salvage policy: source/evidence checkpoint is uploaded before editorial work; a stuck run is replaced rather than babysat."
            echo "- Telemetry policy: every major stage reports measured progress and elapsed time."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_ETA_MINUTES=8"
          echo "PRODUCTION_HARD_TIMEOUT_MINUTES=20"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify autonomous bridge hardening
        run: |
          set -euo pipefail
          python3 scripts/production/test-connector-independent-bridge.py

      - name: Hardened runner preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test -n "${GITHUB_SHA:-}"
          if [[ "${TRIPPEDD_RUNNER_LABEL:-}" != "" ]]; then
            echo "TRIPPEDD_RUNNER_LABEL is configured: $TRIPPEDD_RUNNER_LABEL"
          else
            echo "TRIPPEDD_RUNNER_LABEL not configured; proof gate uses GitHub-hosted fallback."
          fi
          command -v python3
          command -v bash
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media/render stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg mediainfo exiftool imagemagick curl xz-utils libegl1 libgl1 libxrender1 libxkbcommon0 libxkbcommon-x11-0 tesseract-ocr rclone
          command -v ffmpeg
          command -v ffprobe
          python -m pip install --upgrade pip
          python -m pip install -r config/production/oss-stack.requirements.txt
      - name: Install production dependencies
        run: bun install --no-save
      - name: Install and verify Blender
        env:
          BLENDER_VERSION: '4.5.13'
          BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/trippedd
          curl -fsSL "https://download.blender.org/release/Blender4.5/${BLENDER_ARCHIVE}" -o "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}"
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          grep "${BLENDER_ARCHIVE}" /tmp/blender.sha256 | sed "s#${BLENDER_ARCHIVE}#$HOME/.cache/trippedd/${BLENDER_ARCHIVE}#" | sha256sum -c -
          sudo tar -xJf "$HOME/.cache/trippedd/${BLENDER_ARCHIVE}" -C /opt
          sudo ln -sfn "/opt/blender-${BLENDER_VERSION}-linux-x64/blender" /usr/local/bin/blender
          blender --version | head -n 2
      - name: Verify open-source stack before production work
        run: |
          set -euo pipefail
          bash scripts/production/verify-oss-stack.sh
          mediainfo --Version
          exiftool -ver
          convert -version | head -n 1
      - name: Initialize run-local production ledger
        run: |
          set -euo pipefail
          mkdir -p /tmp/trippedd-run-ledger
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" "sha=$GITHUB_SHA" "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/trippedd-run-ledger/run.txt
      - name: Build continuous authored network commercial source
        run: |
          set -euo pipefail
          rm -rf /tmp/trippedd-e2e-source production/network-ident/generated
          mkdir -p /tmp/trippedd-e2e-source
          echo "STAGE_ETA creative-commercial=~1m hard_timeout=3m"
          timeout 3m python3 scripts/production/build-network-commercial.py
          test -s public/production/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4
          cp public/production/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4 /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4 > /tmp/trippedd-e2e-source/ffprobe.json
          mediainfo --Output=JSON /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4 > /tmp/trippedd-e2e-source/mediainfo.json
          exiftool -j /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4 > /tmp/trippedd-e2e-source/exiftool.json
          sha256sum /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4 > /tmp/trippedd-e2e-source/source.sha256
          python - <<'PY'
          import json, subprocess
          p='/tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-IDENT.mp4'
          d=json.load(open('/tmp/trippedd-e2e-source/ffprobe.json'))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert int(v['width']) >= 1280 and int(v['height']) >= 720 and v['r_frame_rate']=='24/1'
          assert 19.9 <= float(d['format']['duration']) <= 20.1 and int(d['format']['size']) > 0
          assert int(a['sample_rate']) >= 44100 and int(a['channels']) >= 1
          r=subprocess.run(['ffmpeg','-v','error','-i',p,'-vf','fps=1','-f','framemd5','-'],capture_output=True,text=True,check=True)
          hashes=[x.split(',')[-1].strip() for x in r.stdout.splitlines() if x and not x.startswith('#') and ',' in x]
          assert len(set(hashes)) >= 8, 'creative commercial is too static'
          r=subprocess.run(['ffmpeg','-hide_banner','-i',p,'-af','volumedetect','-f','null','-'],capture_output=True,text=True,check=True)
          mean=float(next(x.split(':')[1].split()[0] for x in r.stderr.splitlines() if 'mean_volume:' in x))
          assert mean < -12.0, f'commercial audio too quiet: {mean} dB'
          print('AUTHORED_NETWORK_COMMERCIAL_SOURCE=PASS')
          print('UNIQUE_SAMPLED_FRAMES='+str(len(set(hashes))))
          print('MEAN_AUDIO_DB='+str(mean))
          PY
      - name: Salvage source checkpoint before editorial work
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TRIPPEDD-E2E-SOURCE-CHECKPOINT
          path: /tmp/trippedd-e2e-source/*
          if-no-files-found: error
          retention-days: 30
      - name: Build actual mixed-media TRIPPEDD network commercial source
        run: |
          set -euo pipefail
          echo "STAGE_ETA creative-commercial-source=~1m hard_timeout=3m"
          timeout 3m python3 scripts/production/build-network-commercial.py
          test -s public/production/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4
          cp public/production/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4 /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json /tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4 > /tmp/trippedd-e2e-source/creative-commercial.ffprobe.json
          python - <<'PY'
          import json, subprocess
          p='/tmp/trippedd-e2e-source/TRIPPEDD-NETWORK-COMMERCIAL-E2E.mp4'
          d=json.load(open('/tmp/trippedd-e2e-source/creative-commercial.ffprobe.json'))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert 19.9 <= float(d['format']['duration']) <= 20.1
          assert int(v['width']) >= 1280 and int(v['height']) >= 720 and v['r_frame_rate']=='24/1'
          assert int(a['sample_rate']) >= 44100 and int(a['channels']) >= 1
          r=subprocess.run(['ffmpeg','-v','error','-i',p,'-vf','fps=1','-f','framemd5','-'],capture_output=True,text=True,check=True)
          hashes=[x.split(',')[-1].strip() for x in r.stdout.splitlines() if x and not x.startswith('#') and ',' in x]
          assert len(set(hashes)) >= 8, 'creative commercial is too static'
          print('CREATIVE_COMMERCIAL_SOURCE=PASS', len(set(hashes)))
          PY

